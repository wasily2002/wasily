<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlassUI Pro</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: #0f0f1a;
  background-image: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.15) 0%, transparent 50%),
                    radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.12) 0%, transparent 50%);
  color: rgba(255,255,255,0.95);
}

/* Top Menu */
.top-menu {
  position: fixed; top: 0; left: 0; right: 0;
  height: 48px;
  background: rgba(15,15,26,0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  z-index: 200;
  display: flex; align-items: center; padding: 0 24px;
}
.brand { font-size: 15px; font-weight: 700; margin-right: 24px; display: flex; align-items: center; gap: 8px; }
.brand-dot { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg,#6366f1,#8b5cf6); }
.top-nav { display: flex; gap: 4px; }
.top-nav button {
  padding: 6px 14px; border-radius: 8px; font-size: 13px;
  color: rgba(255,255,255,0.55); cursor: pointer; border: none; background: none;
}
.top-nav button:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.95); }
.top-nav button.active { background: rgba(99,102,241,0.15); color: #a5b4fc; }

/* Sidebar */
.sidebar {
  position: fixed;
  left: 16px;
  top: 64px;
  bottom: 44px;
  width: 260px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 24px 12px;
  display: flex; flex-direction: column;
  z-index: 100;
  transition: width 0.3s ease;
  overflow: visible;
}
.sidebar.collapsed { width: 68px; }

.logo {
  display: flex; align-items: center; gap: 12px;
  padding: 0 12px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 16px;
}
.logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg,#6366f1,#8b5cf6);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; flex-shrink: 0;
}
.logo-text { font-size: 18px; font-weight: 600; }
.sidebar.collapsed .logo-text { display: none; }

/* Toggle Button - on RIGHT edge of sidebar */
.toggle-btn {
  position: absolute;
  right: -14px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px; height: 28px;
  background: #1e1e2e;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 105;
  color: rgba(255,255,255,0.55);
  opacity: 0;
  transition: opacity 0.2s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.sidebar:hover .toggle-btn,
.sidebar.collapsed .toggle-btn { opacity: 1; }
.toggle-btn:hover { background: #2a2a3e; color: #a5b4fc; border-color: #6366f1; }

/* Arrow SVG - default points RIGHT (->) */
.toggle-btn svg {
  width: 14px; height: 14px;
  transition: transform 0.3s;
}
/* Expanded: rotate 180deg = arrow points LEFT (<-) to collapse */
.sidebar:not(.collapsed) .toggle-btn svg { transform: rotate(180deg); }
/* Collapsed: no rotation = arrow points RIGHT (->) to expand */
.sidebar.collapsed .toggle-btn svg { transform: rotate(0deg); }

/* Nav */
.nav-group { margin-bottom: 8px; }
.nav-label {
  padding: 8px 12px 6px;
  font-size: 12px;
  color: rgba(255,255,255,0.55);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.sidebar.collapsed .nav-label { display: none; }

.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  color: rgba(255,255,255,0.55);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  position: relative;
}
.nav-item:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.95); }
.nav-item.active { background: rgba(99,102,241,0.15); color: #a5b4fc; }
.nav-item.active::before {
  content: '';
  position: absolute; left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 20px;
  background: linear-gradient(135deg,#6366f1,#8b5cf6);
  border-radius: 0 3px 3px 0;
}
.sidebar.collapsed .nav-item span { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; padding: 10px; }

/* User Card */
.sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); }
.user-card {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 10px;
  cursor: pointer; transition: 0.2s;
}
.user-card:hover { background: rgba(255,255,255,0.08); }
.user-card .avatar {
  width: 36px; height: 36px;
  background: linear-gradient(135deg,#ec4899,#8b5cf6);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; flex-shrink: 0;
}
.user-card .info { font-size: 13px; }
.user-card .name { font-weight: 600; }
.user-card .role { font-size: 11px; color: rgba(255,255,255,0.55); }
.sidebar.collapsed .user-card .info { display: none; }
.sidebar.collapsed .user-card { justify-content: center; }

/* Admin Panel */
.admin-panel {
  position: fixed;
  left: 16px;
  top: 64px;
  bottom: 44px;
  width: 320px;
  background: rgba(15,15,26,0.95);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  z-index: 150;
  transform: translateX(-120%);
  transition: transform 0.3s;
  overflow: hidden;
  display: flex; flex-direction: column;
}
.admin-panel.open { transform: translateX(0); }
.admin-panel-header {
  padding: 20px;
  background: linear-gradient(135deg,rgba(236,72,153,0.2),rgba(139,92,246,0.2));
  border-bottom: 1px solid rgba(255,255,255,0.08);
  position: relative;
}
.admin-panel-close {
  position: absolute; top: 16px; right: 16px;
  width: 28px; height: 28px;
  background: rgba(0,0,0,0.3); border: none; border-radius: 50%;
  color: white; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.admin-panel-avatar {
  width: 64px; height: 64px; border-radius: 16px;
  background: linear-gradient(135deg,#6366f1,#8b5cf6);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 700; margin-bottom: 12px;
}
.admin-panel-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.admin-panel-role { font-size: 12px; color: rgba(255,255,255,0.55); }
.admin-panel-tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.08); }
.admin-panel-tab {
  flex: 1; padding: 12px; font-size: 12px;
  color: rgba(255,255,255,0.55); cursor: pointer;
  border: none; background: none;
  border-bottom: 2px solid transparent;
}
.admin-panel-tab:hover, .admin-panel-tab.active { color: rgba(255,255,255,0.95); }
.admin-panel-tab.active { border-color: #ec4899; }
.admin-panel-content { flex: 1; overflow-y: auto; padding: 16px; }
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; margin-bottom: 6px; color: rgba(255,255,255,0.55); }
.form-input {
  width: 100%; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
  padding: 10px 12px; color: rgba(255,255,255,0.95); font-size: 13px;
}
.theme-colors { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.theme-color { aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
.theme-color.active { border-color: white; }
.switch { position: relative; width: 48px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider {
  position: absolute; cursor: pointer; inset: 0;
  background: rgba(255,255,255,0.1); border-radius: 26px; transition: 0.3s;
}
.switch .slider::before {
  content: ''; position: absolute; height: 20px; width: 20px;
  left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s;
}
.switch input:checked + .slider { background: linear-gradient(135deg,#6366f1,#8b5cf6); }
.switch input:checked + .slider::before { transform: translateX(22px); }
.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

/* Main Area */
.main-area {
  position: fixed;
  top: 64px;
  left: 292px;
  right: 16px;
  bottom: 44px;
  display: flex; flex-direction: column;
  transition: left 0.3s ease;
}
.sidebar.collapsed ~ .main-area { left: 100px; }

.topbar {
  height: 56px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  margin-bottom: 16px;
  flex-shrink: 0;
}

.content {
  flex: 1;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 24px;
  overflow-y: auto;
}

/* Statusbar */
.statusbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 28px;
  background: rgba(15,15,26,0.95);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  font-size: 11px;
  color: rgba(255,255,255,0.55);
}

/* Views */
.view { display: none; height: 100%; }
.view.active { display: flex; flex-direction: column; }

/* Buttons */
.btn {
  padding: 8px 16px; border-radius: 8px; font-size: 13px;
  cursor: pointer; border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.95);
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: rgba(255,255,255,0.08); }
.btn-primary { background: linear-gradient(135deg,#6366f1,#8b5cf6); border: none; }

/* Stat Cards */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card { padding: 20px; border-radius: 12px; }
.stat-card .label { font-size: 12px; color: rgba(255,255,255,0.55); }
.stat-card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }

/* Template Market */
.template-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.template-search { position: relative; flex: 1; min-width: 200px; max-width: 400px; }
.template-search input {
  width: 100%; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 8px;
  padding: 8px 12px 8px 36px; color: rgba(255,255,255,0.95); font-size: 13px;
}
.template-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: rgba(255,255,255,0.55); }
.filter-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-tag {
  padding: 6px 12px; background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
  font-size: 12px; color: rgba(255,255,255,0.55); cursor: pointer;
}
.filter-tag:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.95); }
.filter-tag.active { background: linear-gradient(135deg,#6366f1,#8b5cf6); color: white; border-color: transparent; }
.template-main { display: flex; gap: 16px; flex: 1; min-height: 0; }
.template-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill,minmax(250px,1fr)); gap: 16px; align-content: start; overflow-y: auto; }
.tpl-card {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.3s;
}
.tpl-card:hover { transform: translateY(-4px); border-color: rgba(99,102,241,0.4); }
.tpl-preview { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.tpl-info { padding: 12px; }
.tpl-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.tpl-desc { font-size: 12px; color: rgba(255,255,255,0.55); margin-bottom: 8px; }
.tpl-meta { display: flex; gap: 12px; font-size: 11px; color: rgba(255,255,255,0.55); }
.tpl-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: linear-gradient(135deg,#f59e0b,#ef4444); color: white; margin-left: 6px; }
.template-detail {
  width: 400px; background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
  display: flex; flex-direction: column; overflow: hidden;
  transition: width 0.3s;
}
.template-detail.collapsed { width: 0; border: none; overflow: hidden; }
.tpl-detail-header { height: 200px; position: relative; flex-shrink: 0; }
.tpl-detail-header iframe { width: 100%; height: 100%; border: none; }
.tpl-detail-close {
  position: absolute; top: 8px; right: 8px;
  width: 28px; height: 28px; background: rgba(0,0,0,0.5);
  border: none; border-radius: 50%; color: white; cursor: pointer;
}
.tpl-detail-body { padding: 16px; flex: 1; overflow-y: auto; }
.tpl-detail-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.tpl-detail-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tpl-detail-tag { padding: 4px 10px; background: rgba(255,255,255,0.08); border-radius: 20px; font-size: 11px; color: rgba(255,255,255,0.55); }
.tpl-stats { display: flex; gap: 16px; margin-bottom: 16px; }
.tpl-stat { text-align: center; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px; flex: 1; }
.tpl-stat-value { font-size: 18px; font-weight: 700; color: #a5b4fc; }
.tpl-stat-label { font-size: 10px; color: rgba(255,255,255,0.55); margin-top: 2px; }

/* My Templates */
.mytemplates-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); gap: 12px; }
.mytemplate-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 16px; }
.mytemplate-card h4 { font-size: 14px; margin-bottom: 4px; }
.mytemplate-card .date { font-size: 11px; color: rgba(255,255,255,0.55); }
.empty-state { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.55); }
.empty-state h3 { color: rgba(255,255,255,0.95); margin-bottom: 8px; }

/* IDE */
.ide-container { display: flex; height: 100%; gap: 1px; background: rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; }
.ide-sidebar { width: 180px; background: rgba(15,15,26,0.9); display: flex; flex-direction: column; }
.ide-sidebar-header { padding: 12px; font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.55); border-bottom: 1px solid rgba(255,255,255,0.08); }
.file-list { flex: 1; overflow-y: auto; padding: 8px; }
.file-item { padding: 6px 10px; border-radius: 6px; font-size: 12px; color: rgba(255,255,255,0.55); cursor: pointer; }
.file-item:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.95); }
.file-item.active { background: rgba(99,102,241,0.15); color: #a5b4fc; }
.ide-editor { flex: 1; display: flex; flex-direction: column; background: rgba(15,15,26,0.9); }
.ide-tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.08); }
.ide-tab { padding: 8px 16px; font-size: 12px; color: rgba(255,255,255,0.55); cursor: pointer; border-right: 1px solid rgba(255,255,255,0.08); }
.ide-tab.active { background: rgba(99,102,241,0.1); color: #a5b4fc; }
.ide-code { flex: 1; }
.ide-code textarea { width: 100%; height: 100%; background: transparent; border: none; padding: 16px; color: #e0e0e0; font-family: monospace; font-size: 13px; resize: none; }
.ide-resize { width: 4px; cursor: col-resize; background: transparent; }
.ide-resize:hover { background: rgba(99,102,241,0.5); }
.ide-preview { width: 40%; background: white; display: flex; flex-direction: column; }
.preview-header { padding: 8px 12px; background: rgba(15,15,26,0.95); border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: rgba(255,255,255,0.55); }
.preview-frame { flex: 1; border: none; width: 100%; }

/* AI Ball */
.ai-fab {
  position: fixed; right: 30px; bottom: 60px;
  width: 64px; height: 64px; border-radius: 50%;
  z-index: 1000; cursor: grab;
  display: flex; align-items: center; justify-content: center;
}
.ai-fab:active { cursor: grabbing; }
.ai-core {
  position: relative; width: 56px; height: 56px; border-radius: 50%;
  background: #0a0a15; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.ai-core::before {
  content: ''; position: absolute; inset: -50%;
  width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent, rgba(99,102,241,0.8), transparent, rgba(236,72,153,0.8), transparent, rgba(139,92,246,0.8), transparent);
  animation: ai-spin 2s linear infinite;
}
.ai-core::after {
  content: ''; position: absolute; inset: 4px; border-radius: 50%;
  background: linear-gradient(135deg,#0f0f1a,#1a1a2e);
}
.ai-orb {
  position: absolute; inset: 8px; border-radius: 50%;
  background: linear-gradient(135deg,rgba(99,102,241,0.6),rgba(139,92,246,0.6));
  animation: ai-pulse 1.5s ease-in-out infinite;
  z-index: 1;
}
.ai-icon { position: relative; z-index: 2; font-size: 18px; color: white; font-weight: 700; }
@keyframes ai-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes ai-pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.9); opacity: 0.8; } }

/* AI Window */
.ai-window {
  position: fixed; right: 30px; bottom: 140px;
  width: 380px; height: 500px;
  background: rgba(10,10,20,0.95); backdrop-filter: blur(20px);
  border: 1px solid rgba(99,102,241,0.3); border-radius: 16px;
  display: flex; flex-direction: column; z-index: 999;
  transform: scale(0.9) translateY(20px); opacity: 0; pointer-events: none;
  transition: 0.3s;
}
.ai-window.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: auto; }
.ai-header { padding: 16px; border-bottom: 1px solid rgba(99,102,241,0.2); display: flex; justify-content: space-between; align-items: center; }
.ai-header h3 { font-size: 14px; display: flex; align-items: center; gap: 8px; }
.ai-status { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }
.ai-status.thinking { background: #f59e0b; animation: blink 0.5s infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
.ai-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.ai-msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
.ai-msg.user { align-self: flex-end; background: rgba(99,102,241,0.3); color: #e0e7ff; }
.ai-msg.bot { align-self: flex-start; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.06); }
.ai-input-area { padding: 12px; border-top: 1px solid rgba(99,102,241,0.2); display: flex; gap: 8px; }
.ai-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(99,102,241,0.2); border-radius: 8px; padding: 8px 12px; color: white; font-size: 13px; }

/* Context Menu */
.ctx-menu {
  position: fixed; z-index: 2000; min-width: 180px; padding: 6px;
  background: rgba(25,25,35,0.98); backdrop-filter: blur(16px);
  border: 1px solid rgba(99,102,241,0.4); border-radius: 12px;
  display: none; flex-direction: column;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.ctx-menu.show { display: flex; }
.ctx-header { padding: 10px 14px; font-size: 11px; color: rgba(99,102,241,0.9); border-bottom: 1px solid rgba(99,102,241,0.2); margin-bottom: 4px; font-weight: 600; }
.ctx-item { padding: 10px 14px; border-radius: 6px; font-size: 12px; color: rgba(255,255,255,0.95); cursor: pointer; }
.ctx-item:hover { background: rgba(99,102,241,0.2); color: #a5b4fc; }
.ctx-divider { height: 1px; background: rgba(99,102,241,0.15); margin: 4px 0; }
.ctx-menu-user { border-color: rgba(236,72,153,0.4); }
.ctx-menu-user .ctx-header { color: rgba(236,72,153,0.9); border-color: rgba(236,72,153,0.2); }
.ctx-menu-user .ctx-item:hover { background: rgba(236,72,153,0.2); color: #f9a8d4; }

/* Toast */
.toast {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(30,30,45,0.95); border: 1px solid rgba(99,102,241,0.4);
  padding: 12px 20px; border-radius: 10px; font-size: 13px;
  z-index: 3000; opacity: 0; transition: 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: rgba(16,185,129,0.5); }
</style>
</head>
<body>

<!-- Top Menu -->
<nav class="top-menu">
  <div class="brand"><span class="brand-dot"></span>GlassUI Pro</div>
  <div class="top-nav">
    <button class="active" data-view="dashboard">工作台</button>
    <button data-view="templates">模板市场</button>
    <button data-view="mytemplates">我的模板</button>
    <button data-view="editor">编辑器</button>
  </div>
</nav>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="toggle-btn" id="toggleBtn" title="折叠/展开">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </div>
  
  <div class="logo">
    <div class="logo-icon">G</div>
    <span class="logo-text">GlassUI</span>
  </div>
  
  <div id="sidebarNav"></div>
  
  <div class="sidebar-footer">
    <div class="user-card" id="userCard">
      <div class="avatar">张</div>
      <div class="info">
        <div class="name">张设计师</div>
        <div class="role">管理员</div>
      </div>
    </div>
  </div>
</nav>

<!-- Admin Panel -->
<div class="admin-panel" id="adminPanel">
  <div class="admin-panel-header">
    <button class="admin-panel-close" onclick="adminPanel.toggle()">X</button>
    <div class="admin-panel-avatar" id="adminAvatar">张</div>
    <div class="admin-panel-name" id="adminName">张设计师</div>
    <div class="admin-panel-role">管理员</div>
  </div>
  <div class="admin-panel-tabs">
    <button class="admin-panel-tab active" data-tab="profile" onclick="adminPanel.switchTab('profile')">资料</button>
    <button class="admin-panel-tab" data-tab="settings" onclick="adminPanel.switchTab('settings')">设置</button>
    <button class="admin-panel-tab" data-tab="theme" onclick="adminPanel.switchTab('theme')">主题</button>
  </div>
  <div class="admin-panel-content" id="adminContent"></div>
</div>

<!-- Main Area -->
<div class="main-area" id="mainArea">
  <header class="topbar">
    <div>
      <span style="color:rgba(255,255,255,0.55);font-size:13px" id="bcParent">概览</span>
      <span style="color:rgba(255,255,255,0.55)"> / </span>
      <span style="font-weight:600" id="pageTitle">工作台</span>
    </div>
    <div style="font-size:12px;color:rgba(255,255,255,0.55)" id="clock">00:00</div>
  </header>
  
  <main class="content" id="mainContent">
    <!-- Dashboard -->
    <div id="view-dashboard" class="view active">
      <h2 style="margin-bottom:20px">欢迎回来</h2>
      <div class="stat-grid">
        <div class="stat-card" style="background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.2)">
          <div class="label">总访问量</div><div class="value">128,430</div>
        </div>
        <div class="stat-card" style="background:rgba(236,72,153,0.1);border:1px solid rgba(236,72,153,0.2)">
          <div class="label">模板数量</div><div class="value">256</div>
        </div>
        <div class="stat-card" style="background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2)">
          <div class="label">下载量</div><div class="value">8,542</div>
        </div>
        <div class="stat-card" style="background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.2)">
          <div class="label">用户数</div><div class="value">12,840</div>
        </div>
      </div>
    </div>
    
    <!-- Templates -->
    <div id="view-templates" class="view">
      <div class="template-toolbar">
        <h2>模板市场</h2>
        <div class="template-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="tplSearch" placeholder="搜索模板..." oninput="templates.search(this.value)">
        </div>
      </div>
      <div class="filter-tags" id="filterTags">
        <button class="filter-tag active" data-cat="all" onclick="templates.filter('all')">全部</button>
        <button class="filter-tag" data-cat="landing" onclick="templates.filter('landing')">落地页</button>
        <button class="filter-tag" data-cat="dashboard" onclick="templates.filter('dashboard')">仪表盘</button>
        <button class="filter-tag" data-cat="component" onclick="templates.filter('component')">组件</button>
      </div>
      <div class="template-main">
        <div class="template-grid" id="templateGrid"></div>
        <div class="template-detail collapsed" id="templateDetail">
          <div class="tpl-detail-header">
            <iframe id="detailFrame" sandbox="allow-scripts"></iframe>
            <button class="tpl-detail-close" onclick="templates.closeDetail()">X</button>
          </div>
          <div class="tpl-detail-body">
            <h2 class="tpl-detail-title" id="detailTitle"></h2>
            <div class="tpl-detail-tags" id="detailTags"></div>
            <div class="tpl-stats">
              <div class="tpl-stat"><div class="tpl-stat-value" id="detailDownloads">0</div><div class="tpl-stat-label">下载</div></div>
              <div class="tpl-stat"><div class="tpl-stat-value" id="detailRating">0</div><div class="tpl-stat-label">评分</div></div>
            </div>
            <p id="detailDesc" style="color:rgba(255,255,255,0.55);font-size:13px;line-height:1.6;margin-bottom:16px"></p>
            <button class="btn btn-primary" style="width:100%" onclick="templates.apply()">应用到本地</button>
          </div>
        </div>
      </div>
    </div>
    
    <!-- My Templates -->
    <div id="view-mytemplates" class="view">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2>我的模板</h2>
        <button class="btn btn-primary" onclick="app.nav('templates')">+ 从市场添加</button>
      </div>
      <div class="mytemplates-grid" id="myTemplatesGrid"></div>
    </div>
    
    <!-- Editor -->
    <div id="view-editor" class="view">
      <div class="ide-container">
        <div class="ide-sidebar">
          <div class="ide-sidebar-header">项目文件</div>
          <div class="file-list" id="fileList"></div>
        </div>
        <div class="ide-editor">
          <div class="ide-tabs" id="ideTabs"></div>
          <div class="ide-code"><textarea id="codeArea"></textarea></div>
        </div>
        <div class="ide-resize" id="ideResize"></div>
        <div class="ide-preview">
          <div class="preview-header">实时预览</div>
          <iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts"></iframe>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Statusbar -->
<footer class="statusbar">
  <div>main | 就绪</div>
  <div>v3.9.8</div>
</footer>

<!-- AI Ball -->
<div class="ai-fab" id="aiFab">
  <div class="ai-core">
    <div class="ai-orb"></div>
    <span class="ai-icon">AI</span>
  </div>
</div>

<!-- AI Window -->
<div class="ai-window" id="aiWindow">
  <div class="ai-header">
    <h3><span class="ai-status" id="aiStatus"></span> GlassAI</h3>
    <button style="background:none;border:none;color:rgba(255,255,255,0.55);cursor:pointer" onclick="ai.toggle()">X</button>
  </div>
  <div class="ai-body" id="aiChat">
    <div class="ai-msg bot">你好！我是 GlassAI 助手。有什么可以帮你的？</div>
  </div>
  <div class="ai-input-area">
    <input type="text" class="ai-input" id="aiInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')ai.send()">
    <button class="btn btn-primary" onclick="ai.send()">发送</button>
  </div>
</div>

<!-- Context Menus -->
<div class="ctx-menu" id="ctxAi">
  <div class="ctx-header">AI 控制台</div>
  <div class="ctx-item" onclick="ai.toggle();hideCtx()">打开对话</div>
  <div class="ctx-divider"></div>
  <div class="ctx-item" onclick="ai.setTemp('low');hideCtx()">精确模式</div>
  <div class="ctx-item" onclick="ai.setTemp('balanced');hideCtx()">平衡模式</div>
  <div class="ctx-item" onclick="ai.setTemp('creative');hideCtx()">创意模式</div>
</div>

<div class="ctx-menu ctx-menu-user" id="ctxUser">
  <div class="ctx-header">用户菜单</div>
  <div class="ctx-item" onclick="adminPanel.switchTab('profile');adminPanel.toggle();hideCtx()">个人资料</div>
  <div class="ctx-item" onclick="adminPanel.switchTab('settings');adminPanel.toggle();hideCtx()">设置</div>
  <div class="ctx-item" onclick="adminPanel.switchTab('theme');adminPanel.toggle();hideCtx()">主题</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

function hideCtx() {
  document.getElementById('ctxAi').classList.remove('show');
  document.getElementById('ctxUser').classList.remove('show');
}

document.onclick = function(e) {
  if (!e.target.closest('.ctx-menu') && !e.target.closest('#aiFab') && !e.target.closest('#userCard')) {
    hideCtx();
  }
};

// Sidebar toggle
document.getElementById('toggleBtn').onclick = function() {
  document.getElementById('sidebar').classList.toggle('collapsed');
};

// Admin Panel
var adminPanel = {
  tab: 'profile',
  user: { name: '张设计师', avatar: '张' },
  
  toggle: function() {
    document.getElementById('adminPanel').classList.toggle('open');
  },
  
  switchTab: function(t) {
    this.tab = t;
    var tabs = document.querySelectorAll('.admin-panel-tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('active', tabs[i].dataset.tab === t);
    }
    this.render();
    document.getElementById('adminPanel').classList.add('open');
  },
  
  render: function() {
    var c = document.getElementById('adminContent');
    if (this.tab === 'profile') {
      c.innerHTML = '<div class="form-group"><label class="form-label">用户名</label><input type="text" class="form-input" value="' + this.user.name + '" onchange="adminPanel.user.name=this.value;document.getElementById(\'adminName\').textContent=this.value"></div>' +
        '<button class="btn btn-primary" style="width:100%" onclick="showToast(\'已保存\',\'success\')">保存</button>';
    } else if (this.tab === 'settings') {
      c.innerHTML = '<div class="setting-row"><span>动画效果</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>' +
        '<div class="setting-row"><span>玻璃效果</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>';
    } else if (this.tab === 'theme') {
      c.innerHTML = '<div class="theme-colors">' +
        '<div class="theme-color active" style="background:linear-gradient(135deg,#6366f1,#8b5cf6)" onclick="adminPanel.setTheme(this)"></div>' +
        '<div class="theme-color" style="background:linear-gradient(135deg,#ec4899,#8b5cf6)" onclick="adminPanel.setTheme(this)"></div>' +
        '<div class="theme-color" style="background:linear-gradient(135deg,#10b981,#06b6d4)" onclick="adminPanel.setTheme(this)"></div>' +
        '<div class="theme-color" style="background:linear-gradient(135deg,#f59e0b,#ef4444)" onclick="adminPanel.setTheme(this)"></div>' +
        '</div>';
    }
  },
  
  setTheme: function(el) {
    var colors = document.querySelectorAll('.theme-color');
    for (var i = 0; i < colors.length; i++) colors[i].classList.remove('active');
    el.classList.add('active');
    showToast('主题已更新', 'success');
  }
};

// User card context menu
document.getElementById('userCard').oncontextmenu = function(e) {
  e.preventDefault();
  var m = document.getElementById('ctxUser');
  var r = this.getBoundingClientRect();
  m.style.left = (r.right + 10) + 'px';
  m.style.top = r.top + 'px';
  m.classList.add('show');
};
document.getElementById('userCard').onclick = function() {
  adminPanel.toggle();
};

// Templates
var TEMPLATES = [
  { id: 1, name: 'GlassUI 仪表盘', cat: 'dashboard', color: '#6366f1', desc: '现代数据仪表盘模板', downloads: 15680, rating: 4.9, tags: ['仪表盘', '数据'], premium: false },
  { id: 2, name: 'GlassUI 登录页', cat: 'landing', color: '#ec4899', desc: '现代玻璃态登录页面', downloads: 8940, rating: 4.8, tags: ['登录', '表单'], premium: false },
  { id: 3, name: '任务管理器', cat: 'dashboard', color: '#f59e0b', desc: 'GTD任务管理界面', downloads: 5420, rating: 4.6, tags: ['任务', '效率'], premium: true },
  { id: 4, name: '聊天组件', cat: 'component', color: '#14b8a6', desc: '即时聊天UI组件', downloads: 3890, rating: 4.4, tags: ['聊天', '组件'], premium: false },
  { id: 5, name: '电商卡片', cat: 'landing', color: '#3b82f6', desc: '产品展示卡片', downloads: 6120, rating: 4.6, tags: ['电商', '卡片'], premium: false },
  { id: 6, name: '设置面板', cat: 'component', color: '#8b5cf6', desc: '系统设置界面', downloads: 4230, rating: 4.5, tags: ['设置', '表单'], premium: false }
];

var localTemplates = JSON.parse(localStorage.getItem('local-tpl') || '[]');

var templates = {
  cat: 'all',
  selected: null,
  
  init: function() { this.render(); this.renderMy(); },
  
  filter: function(cat) {
    this.cat = cat;
    var tags = document.querySelectorAll('.filter-tag');
    for (var i = 0; i < tags.length; i++) {
      tags[i].classList.toggle('active', tags[i].dataset.cat === cat);
    }
    this.render();
  },
  
  search: function(q) { this.render(q); },
  
  render: function(q) {
    var grid = document.getElementById('templateGrid');
    var list = TEMPLATES.filter(function(t) { return templates.cat === 'all' || t.cat === templates.cat; });
    if (q) {
      var qq = q.toLowerCase();
      list = list.filter(function(t) { return t.name.toLowerCase().indexOf(qq) !== -1; });
    }
    if (list.length === 0) {
      grid.innerHTML = '<div class="empty-state"><h3>暂无模板</h3></div>';
      return;
    }
    grid.innerHTML = list.map(function(t) {
      return '<div class="tpl-card" onclick="templates.select(' + t.id + ')">' +
        '<div class="tpl-preview" style="background:linear-gradient(135deg,' + t.color + '30,' + t.color + '15)">' + t.name + '</div>' +
        '<div class="tpl-info"><div class="tpl-name">' + t.name + (t.premium ? '<span class="tpl-badge">PRO</span>' : '') + '</div>' +
        '<div class="tpl-desc">' + t.desc + '</div>' +
        '<div class="tpl-meta"><span>' + (t.downloads/1000).toFixed(1) + 'k 下载</span><span>' + t.rating + ' 分</span></div></div></div>';
    }).join('');
  },
  
  select: function(id) {
    var t = null;
    for (var i = 0; i < TEMPLATES.length; i++) {
      if (TEMPLATES[i].id === id) { t = TEMPLATES[i]; break; }
    }
    if (!t) return;
    this.selected = t;
    document.getElementById('templateDetail').classList.remove('collapsed');
    document.getElementById('detailFrame').srcdoc = '<!DOCTYPE html><html><head><style>body{background:' + t.color + ';color:white;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif}</style></head><body><h1>' + t.name + '</h1></body></html>';
    document.getElementById('detailTitle').innerHTML = t.name + (t.premium ? '<span class="tpl-badge">PRO</span>' : '');
    document.getElementById('detailTags').innerHTML = t.tags.map(function(x) { return '<span class="tpl-detail-tag">' + x + '</span>'; }).join('');
    document.getElementById('detailDownloads').textContent = (t.downloads/1000).toFixed(1) + 'k';
    document.getElementById('detailRating').textContent = t.rating;
    document.getElementById('detailDesc').textContent = t.desc;
  },
  
  closeDetail: function() {
    document.getElementById('templateDetail').classList.add('collapsed');
    this.selected = null;
  },
  
  apply: function() {
    if (!this.selected) return;
    localTemplates.unshift({ id: Date.now(), name: this.selected.name, date: new Date().toLocaleDateString() });
    localStorage.setItem('local-tpl', JSON.stringify(localTemplates));
    this.renderMy();
    showToast('已应用到本地', 'success');
  },
  
  renderMy: function() {
    var grid = document.getElementById('myTemplatesGrid');
    if (localTemplates.length === 0) {
      grid.innerHTML = '<div class="empty-state"><h3>暂无本地模板</h3><p>从模板市场应用模板到这里</p></div>';
      return;
    }
    grid.innerHTML = localTemplates.map(function(t) {
      return '<div class="mytemplate-card"><h4>' + t.name + '</h4><div class="date">' + t.date + '</div></div>';
    }).join('');
  }
};

// IDE
var ide = {
  files: {},
  active: 'index.html',
  
  init: function() {
    var saved = localStorage.getItem('ide-files');
    this.files = saved ? JSON.parse(saved) : { 'index.html': '<h1>Hello GlassUI</h1>', 'style.css': 'body { margin: 0; }', 'app.js': 'console.log("Hello");' };
    this.renderFiles();
    this.switchFile('index.html');
    this.setupResize();
  },
  
  renderFiles: function() {
    var self = this;
    document.getElementById('fileList').innerHTML = Object.keys(this.files).map(function(f) {
      return '<div class="file-item ' + (f === self.active ? 'active' : '') + '" onclick="ide.switchFile(\'' + f + '\')">' + f + '</div>';
    }).join('');
  },
  
  switchFile: function(f) {
    this.active = f;
    document.getElementById('ideTabs').innerHTML = '<div class="ide-tab active">' + f + '</div>';
    document.getElementById('codeArea').value = this.files[f] || '';
    this.renderFiles();
    this.preview();
  },
  
  preview: function() {
    document.getElementById('previewFrame').srcdoc = this.files['index.html'] || '';
  },
  
  setupResize: function() {
    var resize = document.getElementById('ideResize');
    var preview = document.querySelector('.ide-preview');
    var dragging = false, startX, startWidth;
    
    resize.onmousedown = function(e) {
      dragging = true;
      startX = e.clientX;
      startWidth = preview.offsetWidth;
    };
    
    document.onmousemove = function(e) {
      if (!dragging) return;
      var newWidth = Math.max(200, startWidth - (e.clientX - startX));
      preview.style.width = newWidth + 'px';
    };
    
    document.onmouseup = function() { dragging = false; };
    
    document.getElementById('codeArea').oninput = function() {
      ide.files[ide.active] = this.value;
      clearTimeout(ide.timer);
      ide.timer = setTimeout(function() { ide.preview(); }, 500);
    };
  }
};

// AI
var ai = {
  temp: 'balanced',
  dragging: false,
  
  init: function() {
    this.setupDrag();
    this.setupCtx();
  },
  
  setupDrag: function() {
    var fab = document.getElementById('aiFab');
    var win = document.getElementById('aiWindow');
    var self = this, startX, startY, startRight, startBottom, moved;
    
    fab.onmousedown = function(e) {
      if (e.button === 2) return;
      self.dragging = true;
      moved = false;
      startX = e.clientX;
      startY = e.clientY;
      startRight = parseInt(fab.style.right) || 30;
      startBottom = parseInt(fab.style.bottom) || 60;
    };
    
    document.onmousemove = function(e) {
      if (!self.dragging) return;
      if (Math.abs(e.clientX - startX) > 3 || Math.abs(e.clientY - startY) > 3) moved = true;
      var newRight = Math.max(0, startRight - (e.clientX - startX));
      var newBottom = Math.max(0, startBottom - (e.clientY - startY));
      fab.style.right = newRight + 'px';
      fab.style.bottom = newBottom + 'px';
      win.style.right = newRight + 'px';
      win.style.bottom = (newBottom + 80) + 'px';
    };
    
    document.onmouseup = function(e) {
      if (!self.dragging) return;
      self.dragging = false;
      if (e.button === 0 && !moved) self.toggle();
    };
  },
  
  setupCtx: function() {
    document.getElementById('aiFab').oncontextmenu = function(e) {
      e.preventDefault();
      var m = document.getElementById('ctxAi');
      m.style.left = e.clientX + 'px';
      m.style.top = e.clientY + 'px';
      m.classList.add('show');
    };
  },
  
  toggle: function() {
    document.getElementById('aiWindow').classList.toggle('open');
    hideCtx();
  },
  
  send: function() {
    var input = document.getElementById('aiInput');
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    
    var chat = document.getElementById('aiChat');
    chat.innerHTML += '<div class="ai-msg user">' + text + '</div>';
    chat.scrollTop = chat.scrollHeight;
    
    document.getElementById('aiStatus').classList.add('thinking');
    
    var self = this;
    setTimeout(function() {
      document.getElementById('aiStatus').classList.remove('thinking');
      var response = self.getResponse(text);
      chat.innerHTML += '<div class="ai-msg bot">' + response + '</div>';
      chat.scrollTop = chat.scrollHeight;
    }, 500 + Math.random() * 1000);
  },
  
  getResponse: function(text) {
    var t = text.toLowerCase();
    if (t.indexOf('代码') !== -1 || t.indexOf('code') !== -1 || t.indexOf('html') !== -1) {
      return '这是一个简单的HTML示例：<br><code>&lt;h1&gt;Hello World&lt;/h1&gt;</code>';
    }
    if (t.indexOf('帮助') !== -1 || t.indexOf('help') !== -1) {
      return '我可以帮你生成代码、回答问题。试试问我一些问题吧！';
    }
    return '我收到了你的消息。有什么具体需要帮助的吗？';
  },
  
  setTemp: function(t) {
    this.temp = t;
    var names = { low: '精确', balanced: '平衡', creative: '创意' };
    showToast('模式: ' + names[t]);
  }
};

// App
var app = {
  init: function() {
    this.buildSidebar();
    this.setupNav();
    templates.init();
    ide.init();
    adminPanel.render();
    ai.init();
    this.startClock();
  },
  
  buildSidebar: function() {
    var nav = document.getElementById('sidebarNav');
    var groups = [
      { label: '概览', items: [{ name: '工作台', page: 'dashboard' }] },
      { label: '资源', items: [{ name: '模板市场', page: 'templates' }, { name: '我的模板', page: 'mytemplates' }] },
      { label: '开发', items: [{ name: '代码编辑器', page: 'editor' }] }
    ];
    
    var html = '';
    for (var i = 0; i < groups.length; i++) {
      html += '<div class="nav-group"><div class="nav-label">' + groups[i].label + '</div>';
      for (var j = 0; j < groups[i].items.length; j++) {
        var item = groups[i].items[j];
        var active = item.page === 'dashboard' ? ' active' : '';
        html += '<a href="#" class="nav-item' + active + '" data-page="' + item.page + '"><span>' + item.name + '</span></a>';
      }
      html += '</div>';
    }
    nav.innerHTML = html;
  },
  
  setupNav: function() {
    var self = this;
    var navItems = document.querySelectorAll('.nav-item');
    for (var i = 0; i < navItems.length; i++) {
      navItems[i].onclick = function(e) {
        e.preventDefault();
        self.nav(this.dataset.page);
      };
    }
    
    var topBtns = document.querySelectorAll('.top-nav button');
    for (var i = 0; i < topBtns.length; i++) {
      topBtns[i].onclick = function() {
        self.nav(this.dataset.view);
      };
    }
  },
  
  nav: function(page) {
    // Update views
    var views = document.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) views[i].classList.remove('active');
    document.getElementById('view-' + page).classList.add('active');
    
    // Update nav items
    var navItems = document.querySelectorAll('.nav-item');
    for (var i = 0; i < navItems.length; i++) {
      navItems[i].classList.toggle('active', navItems[i].dataset.page === page);
    }
    
    // Update top buttons
    var topBtns = document.querySelectorAll('.top-nav button');
    for (var i = 0; i < topBtns.length; i++) {
      topBtns[i].classList.toggle('active', topBtns[i].dataset.view === page);
    }
    
    // Update breadcrumb
    var titles = { dashboard: '工作台', templates: '模板市场', mytemplates: '我的模板', editor: '代码编辑器' };
    var parents = { dashboard: '概览', templates: '资源', mytemplates: '资源', editor: '开发' };
    document.getElementById('pageTitle').textContent = titles[page];
    document.getElementById('bcParent').textContent = parents[page];
  },
  
  startClock: function() {
    setInterval(function() {
      var now = new Date();
      var h = now.getHours().toString().padStart(2, '0');
      var m = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('clock').textContent = h + ':' + m;
    }, 1000);
  }
};

window.onload = function() { app.init(); };
</script>
</body>
