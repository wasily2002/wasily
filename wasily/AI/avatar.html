<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吴笑欣 · 3D 形象</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: fixed; inset: 0; }
  #fallback { display: none; position: fixed; inset: 0; align-items: center;
              justify-content: center; color: #8f959e; font: 13px sans-serif; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="fallback">3D 引擎加载失败（three.min.js 缺失）</div>
<script src="three.min.js"></script>
<script>
(function () {
  if (typeof THREE === "undefined") {
    document.getElementById("fallback").style.display = "flex";
    return;
  }
  // ---------- 场景 ----------
  const stage = document.getElementById("stage");
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 1.35, 4.6);
  camera.lookAt(0, 1.0, 0);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  stage.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const key = new THREE.DirectionalLight(0xfff2e6, 1.1);
  key.position.set(2, 4, 3); key.castShadow = true; scene.add(key);
  const rim = new THREE.DirectionalLight(0xcfe0ff, 0.5);
  rim.position.set(-2, 3, -3); scene.add(rim);

  // 地面阴影盘
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.9, 32),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.08 }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = -0.02; scene.add(shadow);

  // ---------- 材质 ----------
  const M = {
    skin:  new THREE.MeshStandardMaterial({ color: 0xffdcc8, roughness: 0.6 }),
    hair:  new THREE.MeshStandardMaterial({ color: 0x4a3728, roughness: 0.55 }),
    dress: new THREE.MeshStandardMaterial({ color: 0xff7d9c, roughness: 0.7 }),
    white: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }),
    pupil: new THREE.MeshStandardMaterial({ color: 0x2b2b33, roughness: 0.3 }),
    blush: new THREE.MeshBasicMaterial({ color: 0xff9db4, transparent: true, opacity: 0.55 }),
    mouth: new THREE.MeshStandardMaterial({ color: 0xc2504f, roughness: 0.5 }),
    sock:  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 }),
    shoe:  new THREE.MeshStandardMaterial({ color: 0x6b4a3a, roughness: 0.6 }),
  };
  const Sph = (r, m, w = 24, h = 18) => new THREE.Mesh(new THREE.SphereGeometry(r, w, h), m);
  const Cap = (r, l, m) => new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 6, 16), m);

  // ---------- 角色 ----------
  const girl = new THREE.Group(); scene.add(girl);

  // 身体（连衣裙 + 腿）
  const body = new THREE.Group(); girl.add(body);
  const torso = Cap(0.26, 0.3, M.dress); torso.position.y = 0.78; body.add(torso);
  const skirt = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.5, 24), M.dress);
  skirt.position.y = 0.5; body.add(skirt);
  for (const sx of [-1, 1]) {
    const leg = Cap(0.055, 0.22, M.sock); leg.position.set(sx * 0.11, 0.16, 0); body.add(leg);
    const shoe = Sph(0.075, M.shoe); shoe.scale.set(1, 0.65, 1.25);
    shoe.position.set(sx * 0.11, 0.045, 0.03); body.add(shoe);
  }
  // 手臂
  const arms = {};
  for (const sx of [-1, 1]) {
    const g = new THREE.Group(); g.position.set(sx * 0.3, 0.95, 0);
    const arm = Cap(0.05, 0.28, M.skin); arm.position.y = -0.17; g.add(arm);
    const hand = Sph(0.06, M.skin); hand.position.y = -0.36; g.add(hand);
    g.rotation.z = sx * 0.25; body.add(g); arms[sx] = g;
  }

  // 头
  const head = new THREE.Group(); head.position.y = 1.42; girl.add(head);
  head.add(Sph(0.34, M.skin));
  // 头发：后脑壳 + 刘海 + 双马尾
  const back = Sph(0.37, M.hair); back.position.set(0, 0.05, -0.06);
  back.scale.set(1, 1.05, 1); head.add(back);
  const bangs = Sph(0.35, M.hair); bangs.position.set(0, 0.13, 0.07);
  bangs.scale.set(1, 0.62, 1); head.add(bangs);
  const tails = {};
  for (const sx of [-1, 1]) {
    const g = new THREE.Group(); g.position.set(sx * 0.33, 0.18, -0.05);
    const bun = Sph(0.09, M.hair); g.add(bun);
    const tail = Cap(0.07, 0.4, M.hair); tail.position.y = -0.26; g.add(tail);
    head.add(g); tails[sx] = g;
  }
  // 眼睛（白 + 瞳 + 高光）
  const eyes = {};
  for (const sx of [-1, 1]) {
    const g = new THREE.Group(); g.position.set(sx * 0.125, 0.02, 0.30);
    const w = Sph(0.075, M.white); w.scale.set(1, 1.15, 0.5); g.add(w);
    const p = Sph(0.042, M.pupil); p.position.z = 0.045; g.add(p);
    const hl = Sph(0.014, M.white); hl.position.set(0.015, 0.018, 0.075); g.add(hl);
    head.add(g); eyes[sx] = g;
  }
  // 腮红 + 嘴
  for (const sx of [-1, 1]) {
    const b = Sph(0.045, M.blush); b.scale.set(1, 0.6, 0.3);
    b.position.set(sx * 0.19, -0.07, 0.285); head.add(b);
  }
  const mouth = Sph(0.035, M.mouth); mouth.scale.set(1.2, 0.5, 0.4);
  mouth.position.set(0, -0.13, 0.305); head.add(mouth);

  // ---------- 动画状态 ----------
  let t = 0, phase = "idle";
  let blinkAt = 1.5, blinkT = -1;      // 眨眼调度
  let waveT = -1;                      // 挥手
  const mouse = { x: 0, y: 0 };
  addEventListener("mousemove", e => {
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = (e.clientY / innerHeight) * 2 - 1;
  });

  function tick() {
    requestAnimationFrame(tick);
    const dt = 0.016; t += dt;
    const talking = phase === "speaking";
    const thinking = phase === "thinking";

    // 呼吸
    const br = Math.sin(t * (thinking ? 1.4 : 2.2));
    body.scale.y = 1 + br * 0.015;
    head.position.y = 1.42 + br * 0.008;
    skirt.rotation.y = Math.sin(t * 0.8) * 0.03;

    // 头部：跟随鼠标 + 思考歪头
    const targetY = mouse.x * 0.55 + (thinking ? 0.25 : 0);
    const targetX = mouse.y * 0.3 + (talking ? Math.sin(t * 3) * 0.03 : 0);
    head.rotation.y += (targetY - head.rotation.y) * 0.08;
    head.rotation.x += (targetX - head.rotation.x) * 0.08;
    head.rotation.z += (((thinking ? 0.12 : 0) - head.rotation.z) * 0.05);

    // 眨眼
    if (blinkT < 0 && t > blinkAt) { blinkT = 0; }
    if (blinkT >= 0) {
      blinkT += dt;
      const k = blinkT / 0.22;                 // 0→1
      const s = k < 0.5 ? 1 - k * 2 : (k - 0.5) * 2;
      eyes[-1].scale.y = eyes[1].scale.y = Math.max(0.08, s);
      if (k >= 1) { blinkT = -1; blinkAt = t + 1.8 + Math.random() * 3; }
    }

    // 说话嘴型
    mouth.scale.y = talking ? 0.35 + Math.abs(Math.sin(t * 11)) * 0.55 : 0.5;
    mouth.scale.x = talking ? 1.1 + Math.sin(t * 7) * 0.15 : 1.2;

    // 双马尾摆动
    for (const sx of [-1, 1]) {
      const g = tails[sx];
      g.rotation.z = sx * (0.18 + Math.sin(t * 2.2 + sx) * 0.08)
                     + (talking ? Math.sin(t * 6) * 0.06 * sx : 0);
      g.rotation.x = Math.sin(t * 1.7 + sx * 2) * 0.06;
    }

    // 手臂：思考托腮 / 挥手 / 自然摆
    if (waveT >= 0) {
      waveT += dt;
      const g = arms[1];
      g.rotation.z = 1 + Math.sin(t * 9) * 0.35 - 2.6; // 举起右(左视)手挥动
      g.rotation.x = 0;
      if (waveT > 2.2) { waveT = -1; }
    } else if (thinking) {
      arms[-1].rotation.z += ((-2.2) - arms[-1].rotation.z) * 0.08;
      arms[-1].rotation.x += ((-0.9) - arms[-1].rotation.x) * 0.08;
      arms[1].rotation.z += (0.25 - arms[1].rotation.z) * 0.08;
    } else {
      for (const sx of [-1, 1]) {
        arms[sx].rotation.z += ((sx * 0.25 + Math.sin(t * 2 + sx) * 0.05) - arms[sx].rotation.z) * 0.08;
        arms[sx].rotation.x += (0 - arms[sx].rotation.x) * 0.08;
      }
    }

    // 身体微浮
    girl.position.y = Math.sin(t * 1.6) * 0.02;

    renderer.render(scene, camera);
  }
  tick();
  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // 与 agent 状态联动（失败退避，避免刷屏报错）
  let fail = 0;
  function poll() {
    fetch("/agent_status").then(r => r.json()).then(st => {
      fail = 0;
      const p = (st && st.phase) || "idle";
      if (p !== phase) {
        phase = p;
        if (p === "tool") waveT = 0;         // 调用工具时挥个手
      }
    }).catch(() => { fail++; });
    setTimeout(poll, fail > 5 ? 15000 : 2000);
  }
  poll();
  waveT = 0;  // 开场打招呼
})();
</script>
</body>
</html>
