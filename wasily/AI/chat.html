<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wasily（瓦西里）- 智能助手</title>
<style>
  :root {
    /* 对齐 Trae CN 截图采样：窗口 #171717 / 侧栏 #262626 / 卡片 #222222 */
    --bg: #171717;            /* 窗口/聊天主背景 */
    --panel: #222222;         /* AI 消息卡、思考卡 */
    --panel-2: #1c1c1c;       /* 输入卡、提示卡内层 */
    --card: #222222;
    --side: #262626;          /* 左侧栏 */
    --side-hover: #2e2e2e;
    --side-on: #333333;
    --line: #2e2e2e;          /* 边框/分割线 */
    --line-2: #3a3a3a;
    --text: #e8e8e8;          /* 主文本 */
    --sub: #9b9b9b;           /* 次文本/时间戳/占位符 */
    --sub-2: #767676;
    --bubble: #222222;        /* 用户气泡 */
    --green: #3ecf8e;         /* Trae 薄荷绿 */
    --green-hover: #55dfa1;
    --code-bg: #1c1c1c;       /* 代码块背景 */
    --orange: #d8a657;
    --red: #e06c75;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    height: 100vh;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }
  .container {
    width: 100%;
    max-width: 900px;
    height: 100vh;
    background: var(--bg);
    border-radius: 0;
    box-shadow: none;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: none;
    position: relative;
  }
  /* 全局细暗色滚动条 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }
  ::-webkit-scrollbar-track { background: transparent; }
  /* 全屏 / 模拟最大化：聊天区铺满 */
  body:fullscreen { padding: 0; }
  body:fullscreen .container,
  body.win-max .container {
    max-width: none; height: 100vh; height: 100dvh;
    border-radius: 0; border: none; position: fixed; inset: 0; z-index: 999;
  }

  .header {
    background: var(--bg);
    color: var(--text);
    border-bottom: none;
    padding: 10px 14px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  /* TRAE 风格：白色粗体文字 Logo */
  .brand {
    font-size: 19px;
    font-weight: 700;
    color: #f5f5f5;
    letter-spacing: 0.2px;
    padding-left: 6px;
    user-select: none;
  }
  .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  /* 顶部身份条：独立窗口里显示账号与套餐，内嵌面板（agent-embed）已隐藏 header */
  .id-chip {
    font-size: 11.5px; color: #cfd2cb; background: #22241f; border: 1px solid #34362f;
    border-radius: 999px; padding: 3px 10px; white-space: nowrap; user-select: none;
  }
  .id-chip b { color: #8bd5a8; font-weight: 600; margin-right: 4px; }
  .id-chip .plan { color: #8b919b; }
  /* Trae 顶栏积分芯片：✧ 549，点击进入设置页用量管理 */
  .credit-chip {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    color: #cfcfcf; font-size: 12.5px; padding: 4px 8px; cursor: pointer;
    font-family: inherit;
  }
  .credit-chip:hover { background: var(--side-hover); border-color: var(--line); color: #fff; }
  .credit-chip svg { width: 13px; height: 13px; color: #d7b25a; }
  /* 编辑名称弹窗（对齐 Trae「编辑名称」） */
  #nameModal {
    position: fixed; inset: 0; z-index: 1200; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,.55);
  }
  #nameModal.show { display: flex; }
  #nameModal .nm-card {
    width: 360px; background: #1f1f1f; border: 1px solid var(--line-2);
    border-radius: 14px; padding: 18px 18px 14px; box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  #nameModal .nm-title { font-size: 15px; font-weight: 600; color: #f0f0f0; }
  #nameModal .nm-avatar {
    width: 46px; height: 46px; margin: 20px auto 12px; border-radius: 10px;
    background: linear-gradient(135deg, #1d8a4f, #0f5c33); color: #d8ffe9;
    display: flex; align-items: center; justify-content: center;
  }
  #nameModal .nm-avatar svg { width: 24px; height: 24px; }
  #nameModal .nm-input-wrap { position: relative; margin-top: 6px; }
  #nameModal input {
    width: 100%; height: 34px; border-radius: 8px; border: 1px solid #3a3a3a;
    background: #262626; color: #e8e8e8; padding: 0 58px 0 10px; font-size: 13px;
    outline: none; font-family: inherit;
  }
  #nameModal input:focus { border-color: #5a5a5a; }
  #nameModal .nm-count {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    color: #7a7a7a; font-size: 11.5px; user-select: none;
  }
  #nameModal .nm-actions { display: flex; gap: 10px; margin-top: 16px; }
  #nameModal .nm-actions button {
    flex: 1; height: 34px; border-radius: 8px; font-size: 13px; cursor: pointer;
    font-family: inherit; border: 1px solid #3a3a3a; background: #262626; color: #d6d6d6;
  }
  #nameModal .nm-actions button.pri { background: #e8e8e8; border-color: #e8e8e8; color: #171717; font-weight: 600; }
  #nameModal .nm-actions button.pri:hover { background: #fff; }
  /* IDE ↔ Agent 联动：当前编辑器现场提示条（点击在 IDE 中打开该文件） */
  .ide-chip {
    display: flex; align-items: center; gap: 6px; min-width: 0;
    background: #1f2126; border: 1px solid #2c2f36; color: #c9cdd4;
    border-radius: 999px; padding: 4px 10px; font-size: 11.5px; cursor: pointer;
    max-width: 46vw; transition: border-color .15s, background .15s;
  }
  .ide-chip:hover { background: #262930; border-color: #3a3f48; }
  .ide-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: #3fb950; flex-shrink: 0; }
  .ide-chip.off .dot { background: #6b7280; }
  .ide-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 25vw; }
  .ide-chip .sel { color: #8b919b; flex-shrink: 0; }
  .ide-chip .from { color: #4daafc; flex-shrink: 0; }
  /* 历史抽屉里的 IDE 会话区 */
  .h-sect { font-size: 11.5px; color: #8b919b; padding: 10px 14px 4px; display: flex; align-items: center; justify-content: space-between; }
  .h-sect button { background: none; border: none; color: #4daafc; cursor: pointer; font-size: 11.5px; }
  .header .logo {
    width: 32px; height: 32px;
    background: transparent;
    border: none;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; color: var(--text); }
  .header .status { font-size: 11.5px; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-actions { display: flex; gap: 2px; align-items: center; flex-shrink: 0; }
  .icon-btn {
    background: transparent;
    border: none;
    color: #a8a8a8;
    width: 34px; height: 34px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:hover { background: #2a2a2a; color: #e8e8e8; }
  .icon-btn.active { background: var(--green); color: #10220f; }
  .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  /* 窗口控制按钮：最小化/最大化/关闭 */
  .win-btn { border-radius: 8px; width: 34px; font-size: 15px; }
  .win-btn.close:hover { background: #e81123; color: #fff; }
  .v-divider { width: 1px; height: 18px; background: var(--line-2); margin: 0 7px; }

  /* ============ 「⋯」下拉菜单 ============ */
  #menuPanel {
    position: absolute; top: 50px; right: 12px; z-index: 80;
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 6px; min-width: 200px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6); display: none;
    flex-direction: column;
  }
  #menuPanel.show { display: flex; }
  #menuPanel button {
    background: none; border: none; color: #d6d6d6;
    text-align: left; padding: 9px 12px; font-size: 13px;
    border-radius: 7px; cursor: pointer; height: auto; font-weight: 500;
  }
  #menuPanel button:hover { background: #333; }
  #menuPanel .menu-ico { font-size: 15px; margin-right: 9px; color: var(--sub); }
  #menuPanel button:hover .menu-ico { color: var(--green); }
  #menuPanel .m-sep { height: 1px; background: var(--line); margin: 4px 6px; }

  /* ============ 大脑显示区：纯神经网络图标，无背景无边框 ============ */
  #brain-slot { flex-shrink: 0; background: transparent; border: none; }
  .brain-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 2px 14px 0; font-size: 11px; color: #6a6a6a;
    background: transparent; border: none;
  }
  .brain-bar .b-title { font-weight: 600; color: #3fb950; user-select: none; display: inline-flex; gap: 4px; align-items: center; }
  .b-float-btn {
    background: transparent; border: none; color: #6a6a6a;
    font-size: 12px; line-height: 1; height: 20px; width: 22px;
    border-radius: 6px; cursor: pointer; padding: 0;
  }
  .b-float-btn:hover { color: #3fb950; background: rgba(63,185,80,0.1); }
  .b-switch { margin-left: auto; display: flex; align-items: center; gap: 5px; cursor: pointer; color: #6a6a6a; }
  .b-switch input { accent-color: #3fb950; }
  .brain-view {
    height: 220px; overflow: hidden; position: relative;
    background: transparent; border: none; display: none;
  }
  .brain-view.show { display: block; }
  .brain-view iframe {
    border: none; width: 100%; height: 100%; display: block; background: transparent;
  }
  /* 大脑区下边缘：上下拖拽调整高度（默认隐形，悬停显示抓手） */
  .brain-resize {
    height: 8px; cursor: row-resize; background: transparent;
    border: none; position: relative; flex-shrink: 0;
    touch-action: none; z-index: 6;
  }
  .brain-resize::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 44px; height: 3px; border-radius: 2px;
    transform: translate(-50%, -50%); background: transparent;
    transition: background 0.15s;
  }
  .brain-resize:hover::after, .brain-resize.dragging::after { background: #3fb950; }

  /* ============ 聊天区 ============ */
  .chat-wrap { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  #ptrHint {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    text-align: center; font-size: 12px; color: var(--green);
    padding: 6px 0; background: rgba(28,28,28,0.95);
    transform: translateY(-100%); transition: transform 0.15s ease;
    pointer-events: none;
  }
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 24px 12px;
  }
  /* 对话内容整体居中（图四版式：左右留白，正文窄列） */
  .chat > .msg {
    width: 100%;
    max-width: 860px;
    margin-left: auto;
    margin-right: auto;
  }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb { background: #3c3c3c; border-radius: 4px; }
  .chat::-webkit-scrollbar-track { background: transparent; }
  .msg { margin-bottom: 22px; display: flex; gap: 10px; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 10px;
    line-height: 1.6;
    font-size: 15px;
    word-wrap: break-word;
  }
  /* ============ AI 消息：TRAE Agent 风格（全宽、无气泡底色、无分隔线） ============ */
  .msg.ai { display: block; border-bottom: none; padding-bottom: 0; }
  .msg.ai:last-child { border-bottom: none; }
  .agent-msg { width: 100%; max-width: 760px; margin: 0 auto; }
  .agent-head { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .agent-head .avatar {
    width: 26px; height: 26px; font-size: 14px;
    background: linear-gradient(135deg, #1d8a4f, #0f5c33);
    border: none; border-radius: 7px;
    color: #c9f7dc;
  }
  .agent-name { color: #f0f0f0; font-weight: 600; font-size: 15px; letter-spacing: 0.2px; }
  /* Trae 截图 0f783912：助手回复是一张 #222 圆角卡片，标题粗体、正文 13.5px */
  .msg.ai .bubble {
    background: var(--panel); border: 1px solid rgba(255,255,255,.035);
    padding: 13px 16px; max-width: 760px;
    color: var(--text); border-radius: 14px;
  }
  .msg.ai .bubble .md { font-size: 13.5px; line-height: 1.72; }
  .msg.ai .bubble .md p { margin: 0 0 9px; }
  .msg.ai .bubble .md ul, .msg.ai .bubble .md ol { margin: 6px 0 9px; padding-left: 19px; }
  .msg.ai .bubble .md li { margin: 3px 0; }
  /* 思考过程：浅深灰圆角折叠卡片，"思考过程 ›" */
  .agent-think {
    margin: 2px 0 10px; border: none; border-left: none;
    background: var(--card); border-radius: 12px;
    padding: 9px 12px; max-width: 520px;
  }
  .agent-think-head {
    color: var(--sub); font-size: 13px; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 6px;
  }
  .agent-think-head:hover { color: #c8c8c8; }
  .agent-think-head::after { content: '\203A'; font-size: 17px; line-height: 1; color: var(--sub-2); }
  /* 只有耗时、没有步骤可展开：去掉箭头与点击态 */
  .agent-think.tally-only .agent-think-head { cursor: default; }
  .agent-think.tally-only .agent-think-head::after { content: none; }
  .agent-think.open .agent-think-head::after { content: '\2039'; }
  .agent-think-body { display: none; color: var(--sub); font-size: 13px; white-space: pre-wrap; margin-top: 8px; line-height: 1.6; }
  .agent-think.open .agent-think-body { display: block; }
  /* 思考过程内：think 段落 + 累计统计胶囊 */
  .agent-think .tk-p { margin: 6px 0; white-space: pre-wrap; }
  .agent-think .tk-pill {
    display: inline-flex; align-items: center; gap: 4px;
    margin: 3px 0 8px; padding: 4px 10px; border-radius: 8px;
    background: var(--bg); color: var(--sub-2); font-size: 12px;
    cursor: default; user-select: none;
  }
  .agent-think .tk-pill:hover { color: #c8c8c8; }
  .agent-think .tk-pill .arr { color: var(--sub-2); font-size: 13px; }
  /* 元数据行：已读取 N 个文件 · 耗时 N 秒（灰色小字，紧跟 Agent 名称） */
  .agent-meta { color: var(--sub-2); font-size: 12px; margin: -2px 0 8px 30px; user-select: none; }
  /* 参考内容：本次引用过的文件清单，点条目让 IDE 打开 */
  .agent-refs {
    margin: 0 0 10px; max-width: 520px; background: var(--card);
    border-radius: 10px; padding: 9px 12px;
  }
  .agent-refs-head {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    color: var(--sub); font-size: 13px; cursor: pointer; user-select: none;
  }
  .agent-refs-head:hover { color: #c8c8c8; }
  .agent-refs-head .arr { font-size: 15px; color: var(--sub-2); transition: transform .2s; }
  .agent-refs.open .agent-refs-head .arr { transform: rotate(90deg); }
  .agent-refs-body { display: none; margin-top: 8px; }
  .agent-refs.open .agent-refs-body { display: block; }
  .agent-refs .rf-item {
    display: flex; align-items: baseline; gap: 8px;
    padding: 4px 6px; border-radius: 6px; cursor: pointer;
  }
  .agent-refs .rf-item:hover { background: var(--bg); }
  .agent-refs .rf-name { color: #5ab8ff; font-size: 12.5px; flex: none; }
  .agent-refs .rf-path {
    color: var(--sub-2); font-size: 11.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* ===== 文件更改卡片（对齐 Trae：N 个文件已更改 + 增删统计 + 展开列表 + 打开） ===== */
  .fc-card {
    margin: 2px 0 8px; max-width: 560px;
    background: #1c1c1c; border: 1px solid #333333; border-radius: 10px;
    overflow: hidden;
  }
  .fc-head {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; cursor: pointer; user-select: none;
  }
  .fc-head:hover { background: #232323; }
  .fc-ico { flex: none; color: #9a9a9a; font-size: 13px; width: 16px; text-align: center; }
  .fc-ico svg { width: 13px; height: 13px; display: inline-block; vertical-align: -2px; }
  .fc-title { flex: 1; min-width: 0; color: #d6d6d6; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fc-cv { color: #7c7c7c; font-size: 11px; transition: transform .18s; }
  .fc-card.open .fc-cv { transform: rotate(180deg); }
  .fc-stat { flex: none; font-size: 11.5px; display: flex; gap: 6px; }
  .fc-stat .add { color: #00d084; font-style: normal; }
  .fc-stat .del { color: #f0807c; font-style: normal; }
  .fc-open {
    flex: none; color: #9a9a9a; font-size: 12px; padding: 1px 4px;
    border-radius: 5px; cursor: pointer;
  }
  .fc-open svg { width: 12px; height: 12px; display: block; }
  .fc-open:hover { background: #2c2c2c; color: #e6e6e6; }
  .fc-list { display: none; border-top: 1px solid #2c2c2c; }
  .fc-card.open .fc-list { display: block; }
  .fc-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; cursor: pointer; font-size: 12px; color: #b8b8b8;
  }
  .fc-row:hover { background: #232323; }
  .fc-row .fc-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fc-row .fc-stat { font-size: 11px; }
  /* Trae 思考卡：参考内容/思考过程折叠行 + 粗体结论 + 灰色统计 + 提示卡 */
  .think-flow {
    margin: 4px 0 10px; max-width: 760px;
    background: var(--panel); border: 1px solid rgba(255,255,255,.035);
    border-radius: 12px; padding: 9px 14px 10px;
  }
  .tf-head {
    display: flex; align-items: center; gap: 6px;
    color: #9b9b9b; font-size: 12.5px; cursor: pointer; user-select: none;
    padding: 3px 0;
  }
  .tf-head .tf-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    flex: none; animation: lvPulse 1.2s infinite;
  }
  /* 生成中：Trae 同款旋转 ✳（0.9s 线性顺时针），替代静态圆点 */
  .tf-head .tf-spin { display: none; width: 13px; height: 13px; flex: none; color: #9b9b9b; }
  .tf-head .tf-spin svg { width: 13px; height: 13px; display: block; animation: sparkspin 0.9s linear infinite; }
  .think-flow.thinking > .tf-head .tf-spin { display: inline-block; }
  .think-flow.thinking > .tf-head .tf-dot { display: none; }
  .tk-concl { color: #e2e2e2; font-size: 13.5px; font-weight: 600; line-height: 1.7; margin: 7px 0 2px; }
  .tk-stat { color: #8f8f8f; font-size: 12px; line-height: 1.6; margin: 0 0 4px; }
  .tk-stat .arr { color: #6f6f6f; margin-left: 3px; }
  .tk-tip {
    display: flex; align-items: flex-start; gap: 8px; margin: 9px 0 2px;
    padding: 9px 11px; border: 1px solid #333333; border-radius: 10px;
    background: var(--panel-2); color: #c9c9c9; font-size: 12.5px; line-height: 1.6;
  }
  .tk-tip .ic {
    flex: none; width: 14px; height: 14px; margin-top: 2px; color: #9b9b9b;
  }
  .tk-tip .ic svg { width: 14px; height: 14px; display: block; }
  /* 完成后推荐：Trae 胶囊按钮（末尾 →） */
  .rec-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .rec-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 12px; border: 1px solid #333333;
    background: var(--panel); color: #dedede; font-size: 13px;
    font-family: inherit; cursor: pointer; transition: background .15s, border-color .15s;
  }
  .rec-pill:hover { background: #2a2a2a; border-color: #3f3f3f; color: #fff; }
  .rec-pill .rp-arr { color: #8f8f8f; }

  /* Trae：节点图标骑在竖线上，竖线连续贯穿；图标底色遮住线段 */

    max-height: 170px; overflow: auto;

  .tf-empty { color: #7c7c7c; font-size: 12px; }
  .interrupt-card {

  /* 输入框 @ 文件引用 / / 命令菜单 */

  .agent-tools { margin-top: 8px; }

  .agent-tools-detail .td-arg { color: var(--sub-2); font-family: Consolas, "Courier New", monospace; }
  /* AI 消息下方操作图标行：复制 / 重新生成 / 打开 / 分支 / 赞 / 踩 */
  .msg-actions {
    display: flex; align-items: center; gap: 4px;

  .msg-actions button.picked { color: var(--green); }
  .msg-actions button.down-picked { color: #f0807c; }
  /* 消息操作条「⋯」二级菜单 */
  .msg-more-pop {

  .cmd-block {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px;

  .cmd-block .cmd-head { color: #58a6ff; font-size: 11.5px; margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
  .cmd-block code { color: #d4d4d4; white-space: pre-wrap; word-break: break-all; font-family: inherit; }
  .agent-done { margin-top: 10px; color: var(--sub); font-size: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  .agent-done .ok { color: var(--green); font-weight: 600; }

  /* ============ 实时执行过程（Trae 式：思考/工具调用逐步可见） ============ */
  .live-status {
    font-size: 12px; color: var(--green); font-weight: 400; margin-left: 2px;

  @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  .live-tools { margin: 2px 0 6px; max-width: 520px; }

    font-size: 13px; color: var(--sub);
  }
  .live-tool .lt-ico { font-size: 13px; }
  .live-tool .lt-name { color: #5ab8ff; font-family: Consolas, "Courier New", monospace; font-size: 12.5px; }

  .live-tool .lt-state.err { color: #f48771; }
  .agent-think.live-open .agent-think-body { display: block; }
  .agent-think.live-open .agent-think-head::after { content: '\2039'; }
  /* 用户消息：深灰气泡 + 右侧头像 */
  .msg.user { justify-content: flex-end; align-items: flex-start; }
  .msg.user .bubble {
    background: var(--bubble);
    color: var(--text);

    padding: 11px 16px;
  }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;

    font-size: 16px; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg.ai .avatar { background: linear-gradient(135deg, #1d8a4f, #0f5c33); color: #c9f7dc; }
  .msg.user .avatar { background: #2d2d30; border: 1px solid var(--line-2); }

  /* ============ Markdown 排版（.md 容器内） ============ */
  .md p { margin: 16px 0 8px; }                     /* 段前16px 段后8px */
  .md p.ti { text-indent: 2em; }                    /* 首行缩进仅纯文本段落 */
  .md > *:first-child, .md p:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
    color: #cccccc; margin: 16px 0 8px; line-height: 1.4;
  }
  .md h1 { font-size: 20px; border-bottom: 1px solid #3c3c3c; padding-bottom: 5px; }
  .md h2 { font-size: 18px; border-bottom: 1px solid #3c3c3c; padding-bottom: 4px; }
  .md h3 { font-size: 16px; }
  .md h4 { font-size: 15px; }
  .md h5 { font-size: 14px; }
  .md h6 { font-size: 13px; color: #858585; }
  .md ul, .md ol { margin: 8px 0; padding-left: 24px; }
  .md li { margin: 4px 0; }
  .md li > ul, .md li > ol { margin: 4px 0; }
  .md ul li::marker { color: #3fb950; }
  .md a { color: #4daafc; text-decoration: none; border-bottom: 1px dashed rgba(77,170,252,0.5); }
  .md a:hover { color: #8fd0ff; }
  .md b { color: #fff; }
  .md i { color: #d9c8ff; }
  .md s { color: #6a6a6a; }
  .md hr { border: none; border-top: 1px solid #3c3c3c; margin: 14px 0; }
  .md blockquote {
    border-left: 3px solid #3fb950; margin: 10px 0;
    padding: 6px 12px; background: rgba(63,185,80,0.08);
    border-radius: 0 6px 6px 0; color: #a9a9a9;
  }
  /* 行内代码 */
  .md code.ic {
    background: #2d2d30; color: #ce9178;
    border-radius: 5px; padding: 1px 6px;
    font-family: Consolas, "Courier New", monospace; font-size: 0.92em;
  }
  /* 代码块：深色底纹 + 圆角 + 可折叠语言头 */
  .md pre.codeblock {
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0;
    margin: 12px 0;
    overflow: hidden;
  }
  .md pre.codeblock code {
    display: block;
    padding: 10px 12px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12.5px; line-height: 1.6; color: #d4d4d4;
    white-space: pre; overflow-x: auto;
  }
  .md pre.codeblock.folded code {
    max-height: 156px; overflow: hidden; position: relative;
  }
  .md pre.codeblock.folded::after {
    content: ''; position: relative; display: block; height: 0;
    margin-top: -32px; pointer-events: none;
    box-shadow: 0 -22px 18px -12px #1b1b1c inset;
  }
  .md .code-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    background: #252526; border-bottom: 1px solid #3c3c3c;
    user-select: none;
  }
  .md .code-lang {

  }
  .md .code-meta { font-size: 10.5px; color: #6a6a6a; }
  .md .code-fold-btn {
    margin-left: auto; display: inline-flex; align-items: center; gap: 4px;

  }

  .md .code-fold-btn .cb-ico { font-size: 12px; transition: transform 0.2s; }
  .md pre.codeblock:not(.folded) .cb-ico { transform: rotate(180deg); }
  /* 语法高亮配色 */
  .tk-c { color: #6a9955; }   /* 注释 */
  .tk-s { color: #ce9178; }   /* 字符串 */
  .tk-k { color: #569cd6; }   /* 关键字 */
  .tk-n { color: #b5cea8; }   /* 数字 */
  /* Markdown 图片 / 附件图片 */
  .md-img {

  .tool-card {

  /* ============ 工具确认卡片 ============ */
  .confirm-card {

  .confirm-card pre {

  .question-card {
    max-width: 75%;
    background: #252526;
    border: 1px solid rgba(88,166,255,0.45);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);

  /* ============ 开发计划卡片（工程开发智能体：计划先行 → 确认执行） ============ */
  .plan-card {
    max-width: 85%;
    background: #252526;
    border: 1px solid rgba(245,158,11,0.45);

  }
  .plan-card .p-step .p-name { color: #d4d4d4; font-weight: 600; }

  .plan-card .p-btns { display: flex; gap: 10px; margin-top: 10px; }
  .plan-card button {
    flex: 1; height: 34px; border-radius: 6px; border: none;
    font-size: 13px; font-weight: 600; cursor: pointer; color: #fff;
  }
  .plan-card .go { background: var(--green); color: #1e1e1e; }
  .plan-card .go:hover { background: var(--green-hover); }
  .plan-card .cancel { background: #3c3c3c; }
  .plan-card .cancel:hover { background: #4a4a4a; }
  .plan-card button:disabled { opacity: 0.5; cursor: not-allowed; }
  .plan-card .p-state { font-size: 12px; color: #858585; margin-top: 8px; text-align: center; }
  /* 任务编排：人物列表 + 角色/技能/工具标签 */
  .plan-card .p-people { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .plan-card .p-person {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 20px; font-size: 11px;
    background: rgba(245,158,11,0.10); border: 1px solid rgba(245,158,11,0.35);
    color: #e6c07b; cursor: default;
  }
  .plan-card .p-person .av { font-size: 12px; }
  .plan-card .p-person .du { color: #8d8d8d; }
  .plan-card .p-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .plan-card .p-tag {
    font-size: 10px; padding: 1px 7px; border-radius: 20px;
    border: 1px solid #4a4a4a; color: #a9a9a9; background: #242425;
  }
  .plan-card .p-tag.agent { color: #7fb4ff; border-color: rgba(88,166,255,0.45); background: rgba(88,166,255,0.08); }
  .plan-card .p-tag.skill { color: #c792ea; border-color: rgba(199,146,234,0.45); background: rgba(199,146,234,0.08); }
  .plan-card .p-tag.tool.ready { color: #3fb950; border-color: rgba(63,185,80,0.4); background: rgba(63,185,80,0.08); }
  .plan-card .p-tag.tool.installed { color: #58a6ff; border-color: rgba(88,166,255,0.5); background: rgba(88,166,255,0.10); }
  .plan-card .p-tag.tool.missing { color: #f85149; border-color: rgba(248,81,73,0.45); background: rgba(248,81,73,0.08); }
  .plan-card .p-step .p-owner { color: #8d8d8d; font-size: 11px; margin-left: 6px; }

  /* ============ 输入区（TRAE composer：大圆角卡片 + 底部工具行） ============ */
  .input-area {
    padding: 0 20px 14px;
    background: var(--bg);
    border-top: none;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: relative;
  }
  .input-inner { width: 100%; max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; }
  /* 输入互斥提示条：其他对话窗口持锁时显示在输入区上沿 */
  #lockBanner {
    display: none;
    margin: 0 0 8px;
    padding: 7px 12px;
    border-radius: 10px;
    background: rgba(210, 153, 34, 0.12);
    border: 1px solid rgba(210, 153, 34, 0.4);
    color: #e3b341;
    font-size: 12.5px;
    text-align: center;
    flex-shrink: 0;
  }
  #lockBanner.show { display: block; }
  /* 上边缘拖拽手柄（弱化：与底色融合，hover 才显形） */
  .drag-handle {
    height: 8px; cursor: ns-resize; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .drag-handle::after {
    content: ''; width: 40px; height: 3px; border-radius: 2px;
    background: transparent; transition: background 0.15s;
  }
  .drag-handle:hover::after, .drag-handle.dragging::after { background: #4a4a4a; }
  /* composer 大圆角卡片 */
  .composer {
    position: relative;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px 14px 8px;
    transition: border-color 0.15s;
  }
  .composer:focus-within { border-color: #555; }
  .input-wrap { display: flex; }
  textarea {
    flex: 1;
    resize: none;
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0 34px 0 0;   /* 右侧为 ✨ 按钮留位 */
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    outline: none;
    height: 52px;
    min-height: 52px;
    line-height: 1.55;
  }
  textarea:focus { border-color: transparent; }
  textarea::placeholder { color: #7d7d7d; }
  /* composer 卡片内右上 ✨ */
  .composer .spark-btn {
    position: absolute; right: 10px; top: 10px;
    width: 28px; height: 28px;
  }
  /* 附件缩略图条 */
  #attachBar { display: none; flex-wrap: wrap; gap: 8px; padding: 0 0 8px; }
  #attachBar.has { display: flex; }
  /* 一键部署技能条（输入框内） */
  #skillBar { display:none; padding:0 0 9px; }
  #skillBar.has { display:block; }
  .skill-chip { display:inline-flex; align-items:center; gap:9px; max-width:100%;
                background:#1c2026; border:1px solid #2d333b; border-radius:8px;
                padding:5px 9px; font-size:12.5px; }
  .skill-chip .x { width:15px; height:15px; border:0; background:transparent;
                   color:#8b929b; cursor:pointer; font-size:14px; line-height:1;
                   padding:0; flex:none; }
  .skill-chip .x:hover { color:#e6e8e1; }
  .skill-chip .sk { color:#5aa9ff; font-weight:600; flex:none; }
  .skill-chip .tx { color:#c9ced4; overflow:hidden; text-overflow:ellipsis;
                    white-space:nowrap; }
  /* 一键部署结果 */
  .dpl-ok { display:flex; align-items:center; gap:8px; font-size:13.5px; color:#e6e8e1;
            margin:2px 0 14px; }
  .dpl-ok i { width:16px; height:16px; border-radius:4px; background:#1f5c3c;
              color:#7ef0b0; display:inline-flex; align-items:center;
              justify-content:center; font-style:normal; font-size:11px; flex:none; }
  .dpl-sec { font-size:14px; color:#e6e8e1; font-weight:600; margin:16px 0 8px;
             display:flex; align-items:center; gap:6px; }
  .dpl-table { width:100%; border-collapse:collapse; border:1px solid #30322c;
               border-radius:8px; overflow:hidden; font-size:12.5px; }
  .dpl-table th { background:#1d1e1a; color:#9aa093; font-weight:500; text-align:left;
                  padding:9px 12px; border-bottom:1px solid #30322c; }
  .dpl-table td { padding:9px 12px; border-bottom:1px solid #2a2b25; color:#d6d9d1; }
  .dpl-table tr:last-child td { border-bottom:0; }
  .dpl-table td:first-child { width:34%; color:#aeb3a8; }
  .dpl-table a { color:#6fb1e8; text-decoration:none; }
  .dpl-table a:hover { text-decoration:underline; }
  .online { display:inline-flex; align-items:center; gap:6px; color:#4ecb83; }
  .online i { width:6px; height:6px; border-radius:50%; background:#00d084; }
  .dpl-files { display:flex; align-items:center; justify-content:space-between;
               border:1px solid #30322c; border-radius:8px; padding:11px 13px;
               margin-top:14px; font-size:12.5px; color:#d6d9d1; }
  .dpl-files .add { color:#4ecb83; margin-left:10px; }
  .dpl-files .del { color:#f0736a; margin-left:6px; }
  .dpl-site { display:flex; gap:12px; align-items:center; border:1px solid #30322c;
              border-radius:10px; padding:10px; margin-top:12px; background:#1a1b17; }
  .dpl-site .thumb { width:104px; height:58px; border-radius:6px; overflow:hidden;
                     background:#f5f5f3; flex:none; position:relative; }
  .dpl-site .thumb iframe { width:300%; height:300%; transform:scale(.3333);
                            transform-origin:top left; border:0; pointer-events:none; }
  .dpl-site b { font-size:12.5px; color:#e9ebe4; display:block; }
  .dpl-site a { font-size:11.5px; color:#7f8478; text-decoration:none;
                display:block; margin-top:3px; }
  .dpl-site .vis { margin-left:auto; font-size:11px; color:#9aa093;
                   display:flex; align-items:center; gap:4px; }
  .dpl-acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .dpl-acts button { border:1px solid #34362f; background:transparent; color:#c9cec3;
                     border-radius:7px; padding:6px 11px; font-size:12px;
                     cursor:pointer; font-family:inherit; }
  .dpl-acts button:hover { background:#262821; }
  .att-chip { position: relative; width: 56px; height: 56px; }
  .att-chip img {
    width: 100%; height: 100%; object-fit: cover;
    border-radius: 8px; border: 1px solid var(--line-2);
  }
  .att-chip .att-x {
    position: absolute; top: -6px; right: -6px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #e81123; color: #fff; font-size: 10px;
    border: none; cursor: pointer; padding: 0; line-height: 18px; text-align: center;
  }
  /* 文档附件 chip（扩展名徽标 + 文件名 + 大小） */
  .att-doc {
    position: relative; display: flex; align-items: center; gap: 7px;
    max-width: 250px; height: 26px; padding: 0 24px 0 9px;
    background: #232323; border: 1px solid var(--line-2); border-radius: 6px;
    font-size: 12px; color: #d0d0d0;
  }
  .att-doc .doc-ico {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; color: #6fb1e8;
  }
  .att-doc .doc-ico svg { width: 13px; height: 13px; }
  .att-doc .doc-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .att-doc .att-x {
    position: absolute; top: 50%; right: 5px; transform: translateY(-50%);
    width: 15px; height: 15px; border-radius: 50%;
    background: transparent; color: #7d7d7d; font-size: 10px;
    border: none; cursor: pointer; padding: 0; line-height: 15px; text-align: center;
  }
  .att-doc .att-x:hover { background: #e81123; color: #fff; }
  /* 拖放提示（TRAE 同款）：拖入文件时提示框只显示在输入框内部，
     pointer-events:none 不拦截拖动事件，拖放仍在整窗范围生效 */
  #composerDrop {
    position: absolute; inset: 0; z-index: 5; display: none;
    border: 2px dashed #4a8fd4; border-radius: 18px;
    background: rgba(74,143,212,.08);
    flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: #cfe4ff; font-size: 14px; pointer-events: none;
  }
  #composerDrop.show { display: flex; }
  #composerDrop .drop-ico { font-size: 22px; color: #6fb1e8; line-height: 1; }
  #composerDrop .drop-sub { font-size: 11px; color: #8a8a8a; }
  /* composer 卡片内底部工具行（全部使用 Tabler 线性图标） */
  .toolbar {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 2px 0;
    position: relative;
  }
  .ico.spin { animation: icspin 0.8s linear infinite; }
  @keyframes icspin { to { transform: rotate(360deg); } }
  .tb-btn {
    width: 32px; height: 32px; padding: 0;
    background: transparent; border: none; border-radius: 8px;
    font-size: 19px; line-height: 1; cursor: pointer;
    color: var(--sub);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .tb-btn:hover { background: #2a2a2a; color: #e0e0e0; }
  .tb-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .tb-spacer { flex: 1; }
  /* + 圆形按钮（添加附件） */
  .cb-add {
    width: 30px; height: 30px; border-radius: 50%;
    background: #2b2b2b; color: #d6d6d6; font-size: 20px;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .cb-add:hover { background: #363636; }
  /* 橙色盾牌 */
  .cb-shield { color: var(--orange); font-size: 19px; }
  .cb-shield.off { color: var(--sub-2); }
  /* @Agent / Auto 胶囊按钮 */
  .cb-chip {
    height: 30px; padding: 0 10px;
    background: transparent; border: none; border-radius: 8px;
    color: var(--sub); font-size: 13.5px; font-family: inherit;
    cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    transition: background 0.15s, color 0.15s;
  }
  .cb-chip:hover { background: #2a2a2a; color: #e0e0e0; }
  .cb-chip .ico { font-size: 14px; }
  .cb-chip .chev { font-size: 15px; color: var(--sub-2); }
  /* 胶囊下拉浮层 */
  .cb-pop {
    position: absolute; bottom: 38px; left: 0; z-index: 90;
    display: none; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 10px; padding: 5px; min-width: 168px;
    box-shadow: 0 10px 32px rgba(0,0,0,0.6);
  }
  .cb-pop.show { display: flex; }
  .cb-pop button {
    background: none; border: none; text-align: left;
    color: #d6d6d6; font-size: 13px; font-family: inherit;
    padding: 8px 10px; border-radius: 7px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .cb-pop button:hover { background: #333; }
  .cb-pop button .tick { margin-left: auto; color: var(--green); visibility: hidden; }
  .cb-pop button.on .tick { visibility: visible; }
  /* ✨ 提示词按钮（位于 composer 卡片内） */
  .spark-btn.busy { pointer-events: none; animation: sparkspin 0.9s linear infinite; }
  .spark-btn.done { color: var(--green); }
  @keyframes sparkspin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .mic-btn.recording {
    background: #e81123 !important;
    color: #fff;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232,17,35,0.45); }
    50% { box-shadow: 0 0 0 9px rgba(232,17,35,0); }
  }
  #attachBtn.on { background: #2a2a2a; color: #e0e0e0; }
  /* 绿色圆形发送钮（白色向上箭头） */
  button.send-btn {
    background: var(--green);
    color: #0c2a17; border: none;
    border-radius: 50%;
    width: 36px; height: 36px; min-width: 36px; padding: 0;
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.1s;
  }
  button.send-btn .ico { font-size: 19px; color: #0c2a17; }
  button.send-btn:hover { background: var(--green-hover); }
  button.send-btn:active { transform: scale(0.94); }
  button.send-btn:disabled { background: #2e2e2e; color: #666; cursor: not-allowed; }
  button.send-btn:disabled .ico { color: #777; }
  .hint { display: none; }

  /* ============ Token 用量统计条（大脑区下方，紧凑灰字） ============ */
  #tokenBar {
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    padding: 1px 24px 2px; font-size: 11px; line-height: 18px;
    color: var(--sub-2); cursor: pointer; user-select: none;
    white-space: nowrap; overflow: hidden;
  }
  #tokenBar:hover { color: var(--sub); }
  #tokenBar .tok-label { color: #565656; letter-spacing: .3px; }
  #tokenBar b { color: #3fb950; font-weight: 600; }
  #tokenBar .tok-dim b { color: var(--sub); }
  #tokenBar .tok-sep { color: #3d3d3d; }
  #tokenBar .tok-phase { color: #e3b341; }
  #tokenBar .tok-chev { font-size: 12px; transition: transform 0.15s; }
  #tokenBar.open .tok-chev { transform: rotate(180deg); }
  #tokenDetail {
    flex-shrink: 0; display: none; max-height: 132px; overflow-y: auto;
    padding: 0 24px 6px; font-size: 11px; color: var(--sub-2);
  }
  #tokenDetail.show { display: block; }
  #tokenDetail .td-row {
    display: flex; align-items: center; gap: 10px;
    padding: 2px 0; border-top: 1px dashed #262626;
    white-space: nowrap; overflow: hidden;
  }
  #tokenDetail .td-row .td-id { color: var(--sub); }
  #tokenDetail .td-row .td-last { margin-left: auto; color: #565656; }
  #tokenDetail b { color: var(--sub); font-weight: 600; }

  /* ============ 右侧浮动面板（视频通话 / 系统设置，iframe 内嵌） ============ */
  #sidePanel {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 120;
    width: 520px; min-width: 360px; max-width: 92%;
    background: var(--panel); border-left: 1px solid var(--line-2);
    box-shadow: -14px 0 44px rgba(0,0,0,0.5);
    display: none; flex-direction: column;
  }
  #sidePanel.show { display: flex; }
  #sidePanel .sp-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px 6px 16px; border-bottom: 1px solid var(--line);
    font-size: 13px; font-weight: 600; color: var(--text); flex-shrink: 0;
  }
  #sidePanel .sp-title { display: inline-flex; align-items: center; gap: 7px; color: var(--sub); }
  #sidePanel iframe { flex: 1; border: none; width: 100%; background: var(--bg); }
  /* 左缘拖拽调宽手柄 */
  #sidePanel .sp-resize {
    position: absolute; left: -3px; top: 0; bottom: 0; width: 7px;
    cursor: ew-resize; z-index: 2; touch-action: none;
  }
  #sidePanel .sp-resize:hover, #sidePanel .sp-resize.dragging { background: rgba(63,185,80,0.35); }

  /* ============ 灯箱（图片点击放大） ============ */
  #lightbox {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.85);
    display: none; justify-content: center; align-items: center;
    cursor: zoom-out;
  }
  #lightbox.show { display: flex; }
  #lightbox img {
    max-width: 92vw; max-height: 88vh;
    border-radius: 10px; box-shadow: 0 20px 80px rgba(0,0,0,0.8);
  }

  /* ============ TTS 设置面板 ============ */
  #ttsPanel {
    position: absolute; top: 60px; right: 12px; z-index: 70;
    background: #252526; border: 1px solid #3c3c3c;
    border-radius: 8px; padding: 14px; width: 260px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6); display: none;
  }
  #ttsPanel.show { display: block; }
  #ttsPanel h3 { font-size: 13px; color: #cccccc; margin-bottom: 10px; }
  #ttsPanel label { display: block; font-size: 11.5px; color: #858585; margin: 8px 0 3px; }
  #ttsPanel input[type="checkbox"] { accent-color: #3fb950; }
  #ttsPanel select {
    width: 100%; background: #1b1b1c; color: #cccccc;
    border: 1px solid #3c3c3c; border-radius: 6px;
    padding: 7px; font-size: 12.5px; outline: none;
  }

  /* ============ 弹层（历史输入等） ============ */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(3px);
    display: none; justify-content: center; align-items: center;
  }
  .overlay.show { display: flex; }
  .modal {
    width: 560px; max-width: 92vw; max-height: 85vh;
    background: #252526; border: 1px solid #3c3c3c;
    border-radius: 10px; padding: 20px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
  }
  .modal h3 { color: #cccccc; font-size: 15px; }
  .modal input.m-input {
    background: #1b1b1c; border: 1px solid #3c3c3c;
    border-radius: 6px; padding: 10px 12px; font-size: 13px;
    color: #cccccc; font-family: inherit; outline: none; width: 100%;
  }
  .modal input.m-input:focus { border-color: #3fb950; }
  .modal .m-btns { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .modal .m-btns button {
    height: 36px; padding: 0 16px; font-size: 13px; border: none;
    border-radius: 6px; cursor: pointer; color: #fff;
    background: #3fb950;
  }
  .modal .m-btns button:hover { background: #46c160; }
  .btn-ghost { background: #3c3c3c !important; }
  .btn-ghost:hover { background: #4c4c4c !important; }
  /* 历史输入列表 */
  #ihList { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; max-height: 50vh; }
  .ih-item {
    background: #1b1b1c; border: 1px solid #3c3c3c;
    border-radius: 6px; padding: 8px 12px; font-size: 13px; color: #cccccc;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .ih-item:hover { border-color: #3fb950; background: rgba(63,185,80,0.08); }
  .ih-item .ih-txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ih-item .ih-del {
    background: none; border: none; color: #6a6a6a; cursor: pointer;
    font-size: 12px; padding: 2px 4px;
  }
  .ih-item .ih-del:hover { color: #f85149; }
  .ih-empty { text-align: center; color: #6a6a6a; font-size: 12px; padding: 24px 0; }

  /* ============ 历史对话抽屉（服务端记录） ============ */
  #historyDrawer {
    position: fixed; top: 0; right: -420px; width: 400px; max-width: 95vw;
    height: 100vh; z-index: 90;
    background: #1e1e1e; border-left: 1px solid #3c3c3c;
    box-shadow: -10px 0 40px rgba(0,0,0,0.5);
    transition: right 0.25s ease; display: flex; flex-direction: column;
  }
  #historyDrawer.show { right: 0; }
  #historyDrawer .hd {
    padding: 14px 16px; display: flex; gap: 10px; align-items: center;
    border-bottom: 1px solid #3c3c3c;
  }
  #historyDrawer .hd input {
    flex: 1; background: #1b1b1c; border: 1px solid #3c3c3c;

  /* 最小化模拟（无 pywebview 时的兜底）：恢复小胶囊 */
  #minPill {
    position: fixed; right: 16px; bottom: 16px; z-index: 300;

  /* 轻提示 */

  /* ============ 移动端适配（≤768px 气泡式对话） ============ */
  @media (max-width: 768px) {
    body { padding: 0; }

      max-width: none; width: 100vw; height: 100vh; height: 100dvh;

    .chat { padding: 14px 12px; }
    .bubble { max-width: 84%; font-size: 15px; padding: 11px 14px; }

      background: var(--bubble);
      color: #f0f0f0; border-radius: 18px;
    }
    /* AI 全宽 Agent 风格 */
    .msg.ai .bubble { max-width: none; padding: 0; }
    .avatar { width: 32px; height: 32px; }

    textarea { font-size: 15px; }
    .brain-view { height: 160px; }
    #historyDrawer { width: 100vw; max-width: 100vw; right: -100vw; }
    .modal { width: 94vw; }
    .confirm-card { max-width: 94%; }
    .question-card { max-width: 94%; }
  }

  /* Agent 独立窗口只嵌入对话本体，导航与助手信息由外层统一呈现。 */

  body.agent-embed .container { max-width:none; height:100vh; }
  body.agent-embed .header, body.agent-embed #brain-slot,
  body.agent-embed #tokenBar, body.agent-embed #tokenDetail,
  body.agent-embed .hint, body.agent-embed #minPill,

  body.agent-embed .spark-btn, body.agent-embed .cb-shield,

  /* Trae 输入框底部：左侧「完全访问/受保护」、右侧「Auto」在内嵌模式下也显示 */

  }

  /* ===== 侧边对话 ===== */
  #sideRail { position:fixed; left:10px; top:50%; transform:translateY(-50%); z-index:60;
    display:flex; flex-direction:column; gap:5px; padding:6px; border-radius:10px;
    background:rgba(32,33,31,.94); border:1px solid #34362f;
    box-shadow:0 6px 20px rgba(0,0,0,.35); }
  #sideRail .sr-btn { width:28px; height:28px; border:0; border-radius:6px; background:transparent;
    color:#9aa093; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-family:inherit; }
  #sideRail .sr-btn:hover { background:#2c2e29; color:#e6e8e1; }
  #sideRail .sr-btn.on { background:#23342b; color:#8bd5a8; }
  /* 侧边对话 = 独立浮动窗口：拖标题栏移动，拖右下角缩放 */
  #sideDock { position:fixed; inset:0; z-index:59; display:none; pointer-events:none; }
  #sideDock.on { display:block; }
  .side-pane { position:fixed; width:360px; height:520px; display:flex; flex-direction:column;
    background:#1b1c19; border:1px solid #34362f; border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.4); overflow:hidden; pointer-events:auto; }
  .side-pane.dragging { box-shadow:0 18px 44px rgba(0,0,0,.55); border-color:#4a5a4c; }
  /* 四角缩放：四个角各一个手柄，左上/右上要让开标题栏按钮，所以做得薄一些 */
  .sp-resize { position:absolute; width:14px; height:14px; z-index:3; touch-action:none; }
  .sp-resize.se { right:0; bottom:0; cursor:nwse-resize;
    background:linear-gradient(135deg,transparent 50%,rgba(120,200,150,.5) 50%); }
  .sp-resize.sw { left:0; bottom:0; cursor:nesw-resize;
    background:linear-gradient(225deg,transparent 50%,rgba(120,200,150,.5) 50%); }
  .sp-resize.ne { right:0; top:0; height:10px; cursor:nesw-resize; }
  .sp-resize.nw { left:0; top:0; height:10px; cursor:nwse-resize; }
  .sp-resize:hover { background:rgba(120,200,150,.45); }
  body.sp-dragging, body.sp-dragging * { user-select:none !important; }
  .sp-head { display:flex; align-items:center; gap:5px; padding:8px 10px; cursor:move;
    border-bottom:1px solid #2b2d27; background:#20211e; }
  .sp-head button, .sp-head select, .sp-head .sp-title { cursor:pointer; }
  .sp-title { font-size:12.5px; font-weight:600; color:#e6e8e1; flex:none; max-width:74px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .sp-head select { flex:1; min-width:0; font-size:11.5px; padding:3px 4px; border:1px solid #34362f;
    border-radius:5px; background:#141513; color:#cfd3c7; font-family:inherit; outline:none; }
  .sp-head button { border:0; background:transparent; color:#8e9387; cursor:pointer;
    font-size:13px; padding:2px 5px; border-radius:4px; }
  .sp-head button:hover { background:#2c2e29; color:#e6e8e1; }
  .sp-head button.sp-stop { color:#e08b6a; }
  .sp-head button.sp-stop:hover { background:#3a2a24; color:#ffb08a; }
  .sp-msgs { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column;
    gap:8px; font-size:12.5px; line-height:1.6; color:#e6e8e1; }
  .sp-msg { max-width:100%; padding:8px 10px; border-radius:9px; white-space:pre-wrap;
    word-break:break-word; }
  .sp-msg.user { align-self:flex-end; background:#1f3a2b; color:#e6e8e1; }
  .sp-msg.bot { align-self:flex-start; background:#252723; color:#e6e8e1; }
  .sp-msg.sys { align-self:center; background:transparent; color:#8e9387; font-size:11.5px; }
  .sp-input { display:flex; gap:6px; padding:8px; border-top:1px solid #2b2d27; }
  .sp-input textarea { flex:1; resize:none; height:54px; padding:7px 9px; border:1px solid #34362f;
    border-radius:8px; font-size:12.5px; font-family:inherit; outline:none;
    background:#141513; color:#e6e8e1; }
  .sp-input textarea:focus { border-color:#58c789; }
  .sp-input button { width:34px; border:0; border-radius:8px; background:#23a55a; color:#fff;
    cursor:pointer; font-size:14px; }

  /* ===== Workbench：同页等宽多面板，IDE 窄栏退化为标签切换 ===== */
  #wbToolbar, #groupTimeline { display:none; }
  body.workbench { background:#111310; }
  body.workbench .container { max-width:none; height:100vh; }
  body.workbench .header, body.workbench #brain-slot, body.workbench #tokenBar,
  body.workbench #tokenDetail, body.workbench .chat-wrap, body.workbench .input-area,
  body.workbench .hint, body.workbench #sideRail, body.workbench #minPill { display:none; }
  body.workbench #wbToolbar { min-height:46px; display:flex; align-items:center; gap:7px;
    flex-wrap:wrap; overflow-x:auto; padding:7px 10px; border-bottom:1px solid #2b2d27;
    background:#191a17; flex:none; }
  .wb-tool { border:1px solid #34362f; background:#20211e; color:#d8dbd2; border-radius:6px;
    padding:5px 9px; font-size:12px; cursor:pointer; white-space:nowrap; }
  .wb-tool:hover { border-color:#52745e; color:#fff; }
  .wb-tool.on { background:#1f3a2b; border-color:#356746; color:#a8e2bd; }
  #wbNextSpeaker { max-width:150px; border:1px solid #34362f; background:#141513;
    color:#d8dbd2; border-radius:6px; padding:5px; font-size:12px; }

    white-space:nowrap; color:#747b6e; font-size:11px; direction:rtl; }

  #wbTabs button { border:0; border-radius:5px; background:transparent; color:#8e9387;
    padding:5px 7px; font-size:11.5px; cursor:pointer; white-space:nowrap; }
  #wbTabs button.active { background:#2b2e28; color:#e6e8e1; }
  body.workbench #groupTimeline { display:none; max-height:150px; overflow-y:auto; padding:8px 14px;
    border-bottom:1px solid #2b2d27; background:#151613; flex:none; }
  body.workbench #groupTimeline.show { display:block; }
  .gt-row { display:flex; gap:8px; padding:4px 0; font-size:11.5px; line-height:1.5; }
  .gt-name { color:#77bd91; flex:none; min-width:64px; }
  .gt-text { color:#b8bdb1; white-space:pre-wrap; word-break:break-word; }
  .gt-state { color:#747b6e; text-align:center; padding:3px; }
  body.workbench #sideDock { position:static; flex:1; min-height:0; width:100%; max-width:none;
    display:flex; gap:1px; overflow-x:auto; background:#30332c; padding:0; z-index:1;
    pointer-events:auto; }
  body.workbench #sideDock .side-pane { position:relative; left:auto; top:auto; height:auto;
    flex:1 1 0; width:auto; min-width:310px; max-width:none;
    border:0; border-radius:0; box-shadow:none; background:#161714; }
  body.workbench .sp-resize { display:none; }
  body.workbench .sp-head { cursor:default; }
  body.workbench .sp-head { flex-wrap:wrap; min-height:43px; padding:6px 8px; }
  body.workbench .sp-title { max-width:130px; }
  body.workbench .sp-busy-label { color:#76b98e; font-size:10.5px; margin-left:auto; }
  body.workbench .sp-config { width:100%; display:flex; gap:5px; padding-top:4px; }
  body.workbench .sp-config select { height:25px; }
  body.workbench .sp-msgs { padding:12px; gap:10px; }
  body.workbench .sp-msgs .msg { margin-bottom:12px; }
  body.workbench .sp-msgs .agent-msg { max-width:none; }
  body.workbench .sp-msgs .agent-head { margin-bottom:5px; }
  body.workbench .sp-msgs .agent-head .avatar { width:22px; height:22px; }
  body.workbench .sp-msgs .bubble { font-size:12.5px; }
  body.workbench .sp-msgs .msg.user .bubble { background:#244632; border-radius:12px 12px 3px 12px; }
  body.workbench .sp-msgs .msg.user .avatar { display:none; }
  body.workbench .sp-msg.bot { background:transparent; padding:2px 0; }
  body.workbench .sp-msg.user { background:#244632; border-radius:12px 12px 3px 12px; }
  body.workbench .sp-input { padding:10px; background:#191a17; }
  body.workbench .sp-input textarea { height:62px; }
  body.workbench .sp-input button:disabled { opacity:.35; cursor:not-allowed; }
  body.ide-workbench #sideDock .side-pane { display:none; min-width:0; }
  body.ide-workbench #sideDock .side-pane.active { display:flex; }
  body.ide-workbench #wbWorkspace { display:none; }
  @media (max-width:700px) {
    #wbWorkspace { display:none; }
    body.workbench #sideDock .side-pane { min-width:290px; }
  }

  /* ===== TRAE 版式对齐（放在最后，覆盖前面的旧配色） ===== */
  /* 1) 中性深灰：去掉原来的墨绿底色 */
  body.agent-embed { --bg:#181818; --panel:#202020; --line:#333333;
                     --line-2:#3a3a3a; --card:#202020; }
  body.agent-embed .container { background:var(--bg); }
  body.agent-embed .chat { padding:18px 44px 8px; }
  body.agent-embed .chat > .msg, body.agent-embed .agent-msg { max-width:700px; }
  body.agent-embed .msg { margin-bottom:16px; }
  body.agent-embed .agent-head { margin-bottom:6px; }
  body.agent-embed .agent-name { font-size:13px; font-weight:600; }
  /* 2) 灰色圆角气泡：短回答贴内容宽度，长回答撑满内容列 */
  body.agent-embed .msg.ai .bubble,
  body.workbench .sp-msgs .bubble {
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; display:inline-block; max-width:100%; color:var(--text);
    font-size:13.5px; line-height:1.7;
  }
  body.agent-embed .msg.ai .bubble .md,
  body.workbench .sp-msgs .bubble .md { font-size:13.5px; line-height:1.7; }
  body.agent-embed .msg.user .bubble {
    background:var(--bubble); border-radius:12px 12px 3px 12px; font-size:13.5px;
  }
  body.agent-embed .agent-think { max-width:none; }
  /* 3) 输入卡片：圆角描边 + 更小的字号，圆形发送钮 */
  body.agent-embed .input-area { padding:0 44px 16px; }
  body.agent-embed .input-inner { max-width:700px; }
  body.agent-embed .composer {
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:10px 12px 8px;
  }
  body.agent-embed .composer:focus-within { border-color:#4a4a4a; }
  body.agent-embed textarea { font-size:13.5px; height:46px; min-height:46px; }
  body.agent-embed textarea::placeholder { color:#7a7a7a; }
  body.agent-embed button.send-btn { width:30px; height:30px; min-width:30px; }
  body.agent-embed button.send-btn .ico { font-size:17px; }
  body.agent-embed .spark-btn { display:none; }
  /* 4) 空状态：Build With wasily 居中 + 输入卡居中 → 聚焦后落底（Trae 两段式） */
  .chat-hero { display:none; flex:1; min-height:0; flex-direction:column;
    align-items:center; justify-content:center; padding:0 24px 120px; }
  body.chat-empty .chat-hero { display:flex; }
  body.chat-empty #chat { display:none; }
  body.chat-empty:not(.workbench) #tokenBar, body.chat-empty:not(.workbench) #tokenDetail,
  body.chat-empty:not(.workbench) .hint, body.chat-empty:not(.workbench) #brain-slot,
  body.chat-empty:not(.workbench) #wbToolbar, body.chat-empty:not(.workbench) #groupTimeline,
  body.chat-empty:not(.workbench) #sideDock { display:none !important; }
  /* 工作台模式：面板就是对话区，空状态只收工具条；共用输入卡借来当居中卡片 */
  body.chat-empty.workbench #wbToolbar, body.chat-empty.workbench #groupTimeline { display:none !important; }
  body.chat-empty.workbench .chat-wrap { display:flex; }
  body.chat-empty.workbench #inputArea { display:flex; }
  .hero-title { font-size:30px; font-weight:600; letter-spacing:.4px; color:#f2f2f2;
    margin-bottom:26px; user-select:none; }
  .hero-slot { width:100%; max-width:700px; }
  body.chat-empty #inputArea { padding:0; }
  body.chat-empty #inputArea .drag-handle { display:none; }
  body.chat-empty .composer { border-radius:14px; background:var(--panel); border:1px solid var(--line);
    box-shadow:0 10px 34px rgba(0,0,0,.34); }
  .hero-chips { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
  .hero-chips button { border:1px solid var(--line); background:var(--bg); color:#d0d0d0;
    border-radius:9px; padding:8px 14px; font-size:12.5px; font-family:inherit; cursor:pointer; }
  .hero-chips button:hover { border-color:#4a4a4a; color:#fff; }
  /* 5) 工作台面板同色系 */
  body.workbench { background:#111; }
  body.workbench #sideDock { background:var(--panel); }
  body.workbench #sideDock .side-pane { background:#141414; }
  body.workbench .sp-head { background:#191919; border-bottom-color:#272727; }
  body.workbench .sp-input { padding:9px; background:#191919; }
  body.workbench .sp-input textarea { background:var(--panel); border-color:var(--line); border-radius:12px; }
  body.workbench .sp-input button { width:32px; height:32px; border-radius:50%; }

  /* ============================================================
     Trae 对话框 1:1 复刻（参考截图）
     - 顶栏仅保留 TRAE 字标与图标按钮，去掉身份/积分等彩色胶囊
     - 对话区、思考区、提示行全部无底色无描边，不做模块色框区分
     - 输入卡、工具行、发送键按截图尺寸对齐
     ============================================================ */
  .header { height: 48px; padding: 0 8px 0 20px; background: var(--bg); }
  .brand {
    font-size: 13px; font-weight: 700; letter-spacing: .4px;
    color: #e6e6e6; padding-left: 0; text-transform: uppercase;
  }
  .header-left { gap: 0; }
  /* 参考界面没有身份条与窗口分隔线；积分芯片、IDE 芯片保留（T4/T7 入口） */
  #idChip, .header .v-divider { display: none !important; }
  .header-actions { gap: 2px; }
  .header-actions .icon-btn { width: 28px; height: 28px; font-size: 16px; border-radius: 6px; color: #b3b3b3; }
  .header-actions .icon-btn svg.ico { width: 16px; height: 16px; display: block; }
  .header-actions .icon-btn:hover { background: #262626; color: #fff; }
  .header-actions .win-btn { width: 28px; }
  .header-actions .win-btn.close:hover { background: transparent; color: #fff; }
  /* 参考窗口右上角只有一个关闭键，最小化/最大化不展示 */
  #winMin, #winMax { display: none !important; }
  /* 对话区：正文列与输入列共用居中轴，嵌入 Agent 时由更高优先级规则限宽 700px */
  .chat { padding: 18px 20px 10px; }
  .chat > .msg { max-width: 860px; margin: 0 auto 26px; }
  .agent-msg { max-width: none; margin: 0; }
  .agent-head { gap: 8px; margin-bottom: 10px; }
  .agent-head .avatar {
    width: 16px; height: 16px; border-radius: 4px; font-size: 10px;
    background: #189a52; color: #fff;
  }
  .agent-head .avatar .ico { font-size: 11px !important; color: #fff !important; }
  .agent-name {
    font-size: 12px; font-weight: 600; letter-spacing: 1px;
    color: #9a9a9a; text-transform: uppercase;
  }
  .live-status { font-size: 12px; color: #7a7a7a; margin-left: 2px; }
  /* 用户气泡：#2b2b2b、10px 圆角、13.5px 正文 */
  .msg.user .bubble {
    background: #2b2b2b; border: none; border-radius: 10px;
    padding: 10px 14px; font-size: 13.5px; color: #ececec;
  }
  /* AI 正文：无卡片底色、无描边 */
  .msg.ai { background: transparent; }
  .msg.ai .bubble {
    background: transparent; border: none; border-radius: 0;
    padding: 0; max-width: none; color: var(--text);
  }
  .msg.ai .bubble .md { font-size: 13.5px; line-height: 1.72; }
  /* 思考区：完全展开在页面底色上，不做任何色块/边框区分 */

<script>
const _qs = new URLSearchParams(location.search);
const agentEmbed = _qs.get('embed') === 'agent';
const WB_MODE = _qs.get('workbench') === '1';
const WB_ID = String(_qs.get('workbench_id') || '').trim();
const WB_WINDOW_ID = String(_qs.get('window_id') || '').trim();
const WB_IDE = _qs.get('embed') === 'ide';
if (agentEmbed) document.body.classList.add('agent-embed');
if (WB_MODE) document.body.classList.add('workbench');
if (WB_MODE && WB_IDE) document.body.classList.add('ide-workbench');
const chat = document.getElementById('chat');
const input = document.getElementById('input');
if (agentEmbed) input.placeholder = '想做什么事，直接跟我说';
// 模板库「使用模板」跳转过来时预填提示词（agent/index.html 写入 wasily_prefill）
try {
  const _prefill = localStorage.getItem('wasily_prefill');
  if (_prefill) {
    localStorage.removeItem('wasily_prefill');
    input.value = _prefill;
    setTimeout(() => { input.focus(); input.setSelectionRange(_prefill.length, _prefill.length); }, 0);
  }
} catch (e) {}
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const container = document.querySelector('.container');

// IDE ↔ Agent 联动：/chat?session=ide:<id> 直接进入编辑器里那场对话，继续聊
const sessionParam = _qs.get('session') || '';
// 独立对话窗口：主窗口用 ?prompt= 预填提示词、?new=1 要求清空上一轮
const promptParam = _qs.get('prompt') || '';
const newChatParam = _qs.get('new') === '1';
if (promptParam) {
  input.value = promptParam;
  setTimeout(() => { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 0);
}
if (newChatParam) {
  setTimeout(() => {
    if (typeof clearChat === 'function') clearChat();
    try { input.value = ''; input.dispatchEvent(new Event('input')); } catch (e) {}
  }, 0);
}

/* ============ 跨进程通信：Agent 主窗口 ↔ 对话面板/独立窗口 ============ */
// 两个 pywebview 进程各有独立 WebView2 存储，localStorage 不互通，
// 统一走后端内存队列：主窗口 POST 下发命令，这里轮询取走并回传当前状态。
const IPC_MODE = _qs.get('ipc') === '1' || agentEmbed;
// 每个页面实例用独立 client 名：同时开着内嵌面板与独立窗口时，各自维护游标，
// 后端按游标广播，不会出现一条命令只被其中一个窗口消费。
const IPC_CLIENT = ((window.self !== window.top) ? 'chat_embed_' : 'chat_') +
  Math.random().toString(36).slice(2, 8);
// 市场运行命令只消费一次；后续普通发言不会意外沿用上一轮技能。
let pendingSkill = null;

function ipcApply(cmd) {
  const p = cmd.payload || {};
  if (cmd.action === 'set_session' && p.session_id) {
    switchToSession(p.session_id);
  } else if (cmd.action === 'clear') {
    clearChat();
    pendingSkill = null;
    // 主窗口的「新对话」语义是重新开始，草稿也一并清掉
    input.value = '';
    input.dispatchEvent(new Event('input'));
  } else if (cmd.action === 'run_skill' && p.name) {
    pendingSkill = { name: String(p.name) };
    input.value = p.prompt || ('请使用「' + p.name + '」技能协助我完成当前任务。');
    input.dispatchEvent(new Event('input'));
    input.focus();
    // 等输入状态与会话锁同步后再发送；请求体携带 skill，由后端显式注入。
    setTimeout(() => { sendMessage(); }, 60);
  } else if (cmd.action === 'prefill') {
    input.value = p.text || '';
    input.dispatchEvent(new Event('input'));
    input.focus();
    try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
  } else if (cmd.action === 'focus') {
    try { input.focus(); } catch (e) {}
  } else if (cmd.action === 'copy_last') {
    const list = chat.querySelectorAll('.msg.ai .md');
    const last = list[list.length - 1];
    const t = last ? last.innerText.trim() : '';
    if (t) {
      navigator.clipboard.writeText(t).then(() => toast('已复制最近回复')).catch(() => {});
    } else {
      toast('还没有可复制的回复');
    }
  }
}

async function ipcPoll() {

    const r = await fetch('/agent/ipc?client=' + IPC_CLIENT, { cache: 'no-store' });
    const d = await r.json();
    (d.commands || []).forEach(ipcApply);

}

/* ============ 本地存储：对话持久化（key: wasily_chat_history） ============ */
const LS_KEY = 'wasily_chat_history';
const LS_MAX = 200;        // 最多持久化200条

function loadStore() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch (e) { return []; }
}
function saveStore(arr) {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(arr));
  } catch (e) {
    // 超容量：先剥掉最旧消息里的图片，再不行就丢弃最旧消息
    for (const m of arr) { if (m.images && m.images.length) { m.images = []; break; } }
    try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); }
    catch (e2) { arr.shift(); saveStore(arr); }
  }
}
function persistMsg(role, content, images, extra) {
  if (WB_MODE) return;
  const arr = loadStore();
  const item = { role: role, content: content || '', images: images || [], ts: Date.now() };
  // 思考时间线随消息一起存，重开页面后仍能还原「任务耗时 / 已思考」折叠行
  if (extra && extra.steps && extra.steps.length) item.steps = extra.steps;
  if (extra && extra.elapsed) item.elapsed = extra.elapsed;
  arr.push(item);
  while (arr.length > LS_MAX) arr.shift();
  saveStore(arr);
}

function pushInputHist(text) {
  if (!text) return;
  if (inputHist[inputHist.length - 1] !== text) {

}

/* ============ AI 自检：另一个审阅员 AI 检查上一条回答 ============ */
let lastAiReply = '';
let lastUserMsg = '';
let selfChecking = false;
async function runSelfCheck(){
  if (selfChecking) { toast('自检进行中，请稍候'); return; }
  if (!lastAiReply) { toast('还没有可检查的 AI 回答'); return; }
  selfChecking = true;
  addMsg('ai', '🔍 自检中：审阅员 AI 正在检查上一条回答…', { selfcheck: true });
  try {
    const r = await fetch('/selfcheck', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: lastAiReply, question: lastUserMsg })
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '自检失败');
    const head = '【AI 自检】' + (d.verdict || '') + (d.score != null ? ' · 置信度 ' + d.score : '');
    addMsg('ai', head + '\n\n' + d.review, { selfcheck: true });
  } catch (e) {
    addMsg('ai', '⚠️ 自检失败：' + e.message, { selfcheck: true });
  } finally {
    selfChecking = false;
  }
}

/* ============ 大脑显示区：开关 / 下边缘拖拽调高度 / ⤢弹出桌面纯大脑 ============ */
const brainOn = document.getElementById('brainOn');
const brainView = document.getElementById('brainView');
const brainFrame = document.getElementById('brainFrame');
const brainResize = document.getElementById('brainResize');
const brainFloatBtn = document.getElementById('brainFloatBtn');

const BRAIN_H_MIN = 120;
function brainMaxH() {
  // 上限：60% 窗高 与 窗高-200 预留 取小，但不低于最小值
  return Math.max(BRAIN_H_MIN, Math.min(Math.round(window.innerHeight * 0.6),
    Math.round(window.innerHeight) - 200));
}
let savedBrainH = parseInt(localStorage.getItem('wasily_brain_h') || '220', 10);
function applyBrainHeight(h) {
  h = Math.max(BRAIN_H_MIN, Math.min(brainMaxH(), Math.round(h)));
  brainView.style.height = h + 'px';
  return h;
}
function applyBrainSwitch() {
  const on = brainOn.checked;
  brainView.classList.toggle('show', on);
  brainResize.style.display = on ? '' : 'none';
  if (on) {
    if (!brainFrame.src) brainFrame.src = brainFrame.dataset.src;  // 懒加载
    applyBrainHeight(savedBrainH);
  }
}
brainOn.checked = localStorage.getItem('brain_enabled') !== '0';   // 默认展开大脑
brainOn.onchange = () => {
  localStorage.setItem('brain_enabled', brainOn.checked ? '1' : '0');
  applyBrainSwitch();
};

/* ---- 大脑区下边缘：上下拖动调整高度（document 级监听，触摸/鼠标均可） ---- */
let brainDrag = null;
function onBrainMove(e) {
  if (!brainDrag) return;
  brainDrag.h = applyBrainHeight(brainDrag.h + (e.clientY - brainDrag.y));
  brainDrag.y = e.clientY;
}
function endBrainDrag() {
  if (!brainDrag) return;
  savedBrainH = brainView.clientHeight;
  localStorage.setItem('wasily_brain_h', String(savedBrainH));
  brainDrag = null;
  brainResize.classList.remove('dragging');
  document.body.style.userSelect = '';
  brainFrame.style.pointerEvents = '';   // 恢复 iframe 交互
  document.removeEventListener('pointermove', onBrainMove, true);
  document.removeEventListener('pointerup', endBrainDrag, true);
  document.removeEventListener('pointercancel', endBrainDrag, true);
}
brainResize.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  brainDrag = { y: e.clientY, h: brainView.clientHeight };
  brainResize.classList.add('dragging');
  document.body.style.userSelect = 'none';
  // 关键：指针一进入 iframe（大脑区）pointermove 就会被其吞掉，导致高度不再实时跟随；
  // 拖动期间禁用 iframe 指针事件，事件全程留在父文档，高度实时生效
  brainFrame.style.pointerEvents = 'none';
  try { brainResize.setPointerCapture(e.pointerId); } catch (err) {}
  // document 级捕获：即使指针移出把手也能连续拖动
  document.addEventListener('pointermove', onBrainMove, true);
  document.addEventListener('pointerup', endBrainDrag, true);
  document.addEventListener('pointercancel', endBrainDrag, true);
});
window.addEventListener('resize', () => { if (brainOn.checked) applyBrainHeight(savedBrainH); });

/* ============ 轻量 Markdown 解析器（离线自研，无外部依赖） ============ */
function mdEsc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* 简单语法高亮：注释 / 字符串 / 关键字 / 数字 */
function mdHighlight(code) {
  const re = /(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)|('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`(?:[^`\\\n]|\\.)*`)|\b(const|let|var|function|return|if|else|elif|for|while|class|import|from|def|async|await|try|except|finally|with|as|pass|break|continue|new|this|self|None|True|False|null|true|false|undefined|print|len|range|str|int|float|list|dict|set|tuple|in|is|not|and|or|lambda|yield|raise|static|void|long|double|char|bool|struct|enum|switch|case|default|typeof|instanceof|delete|export|extends|super|catch|throw|package|namespace|using|fn|mut|impl|pub|match|loop|go|defer|select|interface|map)\b|(\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)/g;
  return mdEsc(code).replace(re, (m, com, str, kw, num) => {
    if (com) return '<span class="tk-c">' + m + '</span>';
    if (str) return '<span class="tk-s">' + m + '</span>';
    if (kw)  return '<span class="tk-k">' + m + '</span>';
    if (num) return '<span class="tk-n">' + m + '</span>';
    return m;
  });
}

function mdSafeUrl(url) {
  // 清理 URL，阻断 javascript: 等危险协议
  url = url.replace(/["'<>\s\\]/g, '');
  if (/^\s*javascript:/i.test(url) || /^\s*vbscript:/i.test(url)) return '';
  return url;
}

function mdRender(src) {
  if (!src) return '';
  src = String(src).replace(/\r\n?/g, '\n');

  // 1) 提取围栏代码块 ```lang ... ``` 为占位符（带语言头 + 折叠，>12 行默认收起）
  const blocks = [];
  src = src.replace(/```([^\n`]*)\n?([\s\S]*?)(?:```|$)/g, (m, lang, code) => {
    lang = (lang || '').trim();
    // 协议块（tool_call/tasks/plan 等）不是正文代码：一律不渲染成代码卡，
    // 否则模型漏写 JSON 的空 ```tool 块会显示为「TOOL 1 行」的空白卡片
    if (/^(tool|tool_call|tasks|plan|task|task_done)$/i.test(lang)) return '';
    const codeText = code.replace(/\n+$/, '');
    if (!codeText.trim()) return '';   // 空代码块不渲染「N 行」空卡
    const lines = codeText.split('\n').length;
    const folded = lines > 12 ? ' folded' : '';
    blocks.push('<pre class="codeblock' + folded + '" data-lines="' + lines + '">' +
      '<div class="code-bar"><span class="code-lang">' + (mdEsc(lang) || 'code') + '</span>' +
      '<span class="code-meta">' + lines + ' 行</span>' +
      '<button type="button" class="code-fold-btn" tabindex="-1">' +
      '<i data-icon="arrows-minimize" class="ico cb-ico"></i><span class="cb-txt">' +
      (lines > 12 ? '展开' : '收起') + '</span></button></div>' +
      '<code>' + mdHighlight(codeText) + '</code></pre>');
    return '\n\u0000' + (blocks.length - 1) + '\u0000\n';
  });

  // 2) 转义剩余 HTML
  src = mdEsc(src);

  // 3) 提取行内代码 `code` 为占位符
  const inls = [];
  src = src.replace(/`([^`\n]+)`/g, (m, c) => {
    inls.push('<code class="ic">' + c + '</code>');
    return '\u0001' + (inls.length - 1) + '\u0001';
  });

  // 4) 行内元素：图片、链接、粗体、斜体、删除线
  function inline(t) {
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, (m, alt, url) => {
      url = mdSafeUrl(url);
      if (!url) return alt;
      return '<img class="md-img" src="' + url + '" alt="' + alt + '" loading="lazy">';
    });
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (m, txt, url) => {
      url = mdSafeUrl(url);
      if (!url) return txt;
      return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + txt + '</a>';
    });
    t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/__([^_]+)__/g, '<b>$1</b>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
         .replace(/(^|[^_])_([^_\n]+)_/g, '$1<i>$2</i>');
    t = t.replace(/~~([^~]+)~~/g, '<s>$1</s>');
    return t;
  }

  // 5) 块级解析：标题 / 分割线 / 引用 / 列表 / 段落
  const lines = src.split('\n');
  let html = '', i = 0;
  const listStack = [];
  function closeLists(minIndent) {
    while (listStack.length && listStack[listStack.length - 1].indent >= minIndent) {
      html += '</' + listStack.pop().type + '>';
    }
  }
  const BLOCK_START = /^\s*(\u0000\d+\u0000|#{1,6}\s|[-*+]\s|\d+[.)]\s|>|&gt;)/;

  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { closeLists(0); i++; continue; }

    // 代码块占位符（独占一行）
    let m = line.match(/^\s*\u0000(\d+)\u0000\s*$/);
    if (m) { closeLists(0); html += '\u0000' + m[1] + '\u0000'; i++; continue; }

    // 标题 #-######
    m = line.match(/^(#{1,6})\s+(.*)$/);
    if (m) { closeLists(0); const lv = m[1].length;
      html += '<h' + lv + '>' + inline(m[2].trim()) + '</h' + lv + '>'; i++; continue; }

    // 分割线
    if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { closeLists(0); html += '<hr>'; i++; continue; }

    // 引用块（连续 > 行；注意 > 已被转义为 &gt;）
    const QUOTE_RE = /^\s*(?:>|&gt;)\s?/;
    if (QUOTE_RE.test(line)) {
      closeLists(0);
      const qs = [];
      while (i < lines.length && QUOTE_RE.test(lines[i])) {
        qs.push(lines[i].replace(QUOTE_RE, '')); i++;
      }
      html += '<blockquote>' + qs.map(q => inline(q)).join('<br>') + '</blockquote>';
      continue;
    }

    // 列表项（支持按缩进嵌套，有序/无序混合）
    m = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (m) {
      const indent = m[1].replace(/\t/g, '  ').length;
      const type = /^\d/.test(m[2]) ? 'ol' : 'ul';
      if (!listStack.length || indent > listStack[listStack.length - 1].indent) {
        html += '<' + type + '>'; listStack.push({ type: type, indent: indent });
      } else {
        closeLists(indent + 1);
        if (listStack.length && listStack[listStack.length - 1].indent === indent
            && listStack[listStack.length - 1].type !== type) {
          html += '</' + listStack.pop().type + '><' + type + '>';
          listStack.push({ type: type, indent: indent });
        }
        if (!listStack.length) { html += '<' + type + '>'; listStack.push({ type: type, indent: indent }); }
      }
      html += '<li>' + inline(m[3].trim()) + '</li>';
      i++; continue;
    }

    // 普通段落：收集到空行或下一个块级元素为止
    closeLists(0);
    const ps = [line]; i++;
    while (i < lines.length && lines[i].trim()
           && !BLOCK_START.test(lines[i])
           && !/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])) {
      ps.push(lines[i]); i++;
    }
    const inner = ps.map(p => inline(p.trim())).join('<br>');
    // 首行缩进仅加给纯文本段落（含图片的段落不缩进）
    const cls = /<\s*img/.test(inner) ? '' : ' class="ti"';
    html += '<p' + cls + '>' + inner + '</p>';
  }
  closeLists(0);

  // 6) 还原占位符
  html = html.replace(/\u0000(\d+)\u0000/g, (m, n) => blocks[+n] || '');
  html = html.replace(/\u0001(\d+)\u0001/g, (m, n) => inls[+n] || '');
  return html;
}

/* Markdown → 纯文本（供 TTS 朗读） */
function mdToPlain(t) {
  return String(t)
    .replace(/```[\s\S]*?(?:```|$)/g, '。代码略。')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '。图片。')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/[#>*`_~|-]/g, '')

/* 文本类文档扩展名白名单（代码/配置/数据标记语言） */
const DOC_EXTS = ['txt','md','markdown','json','js','ts','jsx','tsx','py','html','htm','css',
  'csv','tsv','log','yaml','yml','xml','ini','conf','env','bat','cmd','ps1','sh',
  'c','h','cpp','hpp','cs','java','go','rs','rb','php','sql','r','swift','kt','vue','toml','svg'];

function fmtDur(ms) {

/* 递归收集拖入的文件（含文件夹）：用 webkitGetAsEntry 逐层展开目录，
   全部扁平化后再回调 handleFiles。不支持该 API 时回退到 dataTransfer.files */
function collectDroppedFiles(dataTransfer, done) {
  const items = dataTransfer && dataTransfer.items;
  const entries = [];
  if (items && items.length) {
    for (const it of items) {
      if (it.kind === 'file') {
        const en = it.webkitGetAsEntry && it.webkitGetAsEntry();
        if (en) entries.push(en);
      }
    }
  }
  if (!entries.length) { done(Array.from((dataTransfer && dataTransfer.files) || [])); return; }
  const out = [];
  let pending = entries.length;
  function finish() { if (--pending <= 0) done(out); }
  function readEntry(entry) {
    if (entry.isFile) {
      entry.file(f => { out.push(f); finish(); }, () => finish());
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const readBatch = () => reader.readEntries(batch => {
        if (!batch.length) { finish(); return; }
        batch.forEach(sub => { pending++; readEntry(sub); });
        readBatch();               // readEntries 分批返回，需循环读到空
      }, () => finish());
      readBatch();
    } else {
      finish();
    }
  }
  entries.forEach(readEntry);
}

/* 文件统一入口：图片 → base64 附件；文本类文档 → 读取内容随消息发给模型 */
function isTextLike(f) {
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  return !f.type || (f.type && (f.type.startsWith('text/') || f.type === 'application/json'
    || f.type === 'application/javascript' || f.type === 'application/xml'))
    || DOC_EXTS.includes(ext);
}
function handleFiles(files) {
  let imgs = 0, docs = 0, skipped = 0;
  Array.from(files || []).forEach(f => {
    if (!f) return;
    if (f.type && f.type.startsWith('image/')) { readImageFile(f); imgs++; return; }
    if (isTextLike(f)) { readDocFile(f); docs++; return; }
    skipped++;
  });
  if (imgs) toast('已添加 ' + imgs + ' 张图片');
  if (docs) toast('已添加 ' + docs + ' 个文档');
  if (skipped) toast(skipped + ' 项已跳过（支持图片与文本类文档）');
}
function readDocFile(file) {
  if (file.size > 2 * 1024 * 1024) { toast('「' + file.name + '」超过 2MB，已跳过'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    let t = String(reader.result || '');
    if (t.length > 200000) t = t.slice(0, 200000) + '\n…（内容过长已截断）';
    addPendingDoc({ name: file.name, size: file.size, text: t });
  };
  reader.readAsText(file);
}
function addPendingDoc(doc) {
  pendingDocs.push(doc);
  renderAttachBar();
}

function refPlace() {

function refMatch() {
  const v = input.value;
  const pos = input.selectionStart == null ? v.length : input.selectionStart;
  const before = v.slice(0, pos);
  let m = before.match(/(^|\n)\/([^\s\/@]*)$/);
  if (m) return { mode: 'cmd', q: m[2], start: pos - m[2].length - 1, end: pos };
  m = before.match(/(^|\s)@([^\s@]*)$/);
  if (m) return { mode: 'file', q: m[2], start: pos - m[2].length - 1, end: pos };

function insertAtCursor(t) {

const REF_CMDS = [

  { label: '/clear', desc: '清空当前对话', run: () => clearChat() },
  { label: '/file', desc: '引用工作区文件（等同输入 @）', run: () => insertAtCursor('@') },
  { label: '/help', desc: '查看可用命令', run: () => toast('可用命令：/new 新对话、/clear 清空、/file 引用文件') }
];
function syncRefPop() {
  if (WB_MODE) { hideRefPop(); return; }
  const mt = refMatch();
  if (!mt) { hideRefPop(); return; }
  refMode = mt.mode;
  refSpan = { start: mt.start, end: mt.end };
  if (refMode === 'cmd') {
    const q = mt.q.toLowerCase();
    refItems = REF_CMDS.filter(c => !q || c.label.slice(1).startsWith(q))
      .map(c => ({ label: c.label, desc: c.desc, cmd: c }));

    try {

      const d = await r.json();
      if (refMode !== 'file') return;

        ({ label: f.name, desc: f.rel, path: f.path, size: f.size }));

async function chooseRef(i) {

  if (it.cmd) {

    input.setSelectionRange(span.start, span.start);

    const d = await r.json();

  } else if (e.key === 'ArrowUp') {
    refIdx = Math.max(refIdx - 1, 0);

  } else if ((e.key === 'Enter' || e.key === 'Tab') && refItems.length) {
    chooseRef(refIdx); e.preventDefault(); e.stopPropagation();

}, true);

/* 大图压缩到最长边1024px，避免 localStorage 爆容量 */
function downscaleImage(dataUrl, cb) {
  const img = new Image();
  img.onload = () => {
    const MAX = 1024;
    if (img.width <= MAX && img.height <= MAX && dataUrl.length < 400 * 1024) return cb(dataUrl);
    const scale = Math.min(1, MAX / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width * scale);
    cv.height = Math.round(img.height * scale);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    cb(cv.toDataURL('image/jpeg', 0.85));
  };
  img.onerror = () => cb(dataUrl);
  img.src = dataUrl;
}
function addPendingImg(dataUrl) {

input.addEventListener('paste', (e) => {

  const files = [];
  for (const it of (cd.items || [])) {

      if (f && (f.type || f.size)) files.push(f);
    }

  });
  doc.addEventListener('dragover', (e) => { e.preventDefault(); });   // 允许 drop
