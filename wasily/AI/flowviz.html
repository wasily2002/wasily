<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wasily 运行可视化</title>
<style>
  :root {
    --acc: #ff8a3c;
    --cy: #39d0ff;
    --bg-menu: rgba(12, 18, 30, 0.96);
    --bd-menu: rgba(57, 208, 255, 0.28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #000; width: 100%; height: 100%; overflow: hidden;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none; color: #cfe9ff;
  }
  #cv { position: fixed; inset: 0; cursor: grab; }
  #cv:active { cursor: grabbing; }

  /* 顶栏：标题 + 实时相位 */
  #hud { position: fixed; top: 12px; left: 16px; pointer-events: none; z-index: 10; }
  #hud h1 { font: 600 14px Consolas, monospace; color: #7fd4ff; letter-spacing: 4px;
    text-shadow: 0 0 12px rgba(0,180,255,.8); }
  #phase { margin-top: 6px; font: 12px "Microsoft YaHei"; color: rgba(160,205,245,.85);
    display: flex; align-items: center; gap: 6px; }
  #phaseDot { width: 8px; height: 8px; border-radius: 50%; background: #2a6a8a;
    box-shadow: 0 0 8px currentColor; }
  #hint { position: fixed; bottom: 54px; left: 16px; font: 11px "Microsoft YaHei";
    color: rgba(140,190,235,.45); letter-spacing: 1px; pointer-events: none; z-index: 10; }

  /* 图例 */
  #legend { position: fixed; top: 12px; right: 332px; z-index: 10;
    background: var(--bg-menu); border: 1px solid var(--bd-menu); border-radius: 10px;
    padding: 8px 12px; font: 11px "Microsoft YaHei"; color: rgba(180,220,250,.85); }
  #legend b { color: #7fd4ff; display: block; margin-bottom: 4px; letter-spacing: 2px; }
  #legend span { display: inline-flex; align-items: center; gap: 5px; margin: 2px 8px 2px 0; }
  #legend i { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }

  /* 右侧时间线面板 */
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 320px; z-index: 20;
    background: var(--bg-menu); border-left: 1px solid var(--bd-menu);
    display: flex; flex-direction: column; }
  #panel h2 { font: 600 12px Consolas, monospace; color: #7fd4ff; letter-spacing: 3px;
    padding: 12px 14px 8px; border-bottom: 1px solid rgba(57,208,255,.14); }
  #tl { flex: 1; overflow-y: auto; padding: 6px 8px; }
  #tl::-webkit-scrollbar { width: 6px; }
  #tl::-webkit-scrollbar-thumb { background: rgba(57,208,255,.25); border-radius: 3px; }
  .ev { padding: 6px 8px; margin: 3px 0; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent; font: 12px "Microsoft YaHei"; }
  .ev:hover { background: rgba(57,208,255,.08); }
  .ev.sel { border-color: var(--bd-menu); background: rgba(57,208,255,.12); }
  .ev .t { color: rgba(140,190,235,.5); font: 10px Consolas, monospace; margin-right: 6px; }
  .ev .tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 10px;
    margin-right: 6px; }
  .ev .s { color: rgba(210,235,255,.8); }
  .ev.dim { opacity: .35; }
  .tag-user { background: rgba(57,208,255,.18); color: #39d0ff; }
  .tag-think { background: rgba(180,140,255,.18); color: #b48cff; }
  .tag-tool { background: rgba(255,170,51,.18); color: #ffaa33; }
  .tag-ok { background: rgba(74,222,128,.16); color: #4ade80; }
  .tag-err { background: rgba(255,90,106,.16); color: #ff5a6a; }
  .tag-reply { background: rgba(143,247,255,.15); color: #8ff7ff; }

  /* 详情卡 */
  #dt { border-top: 1px solid rgba(57,208,255,.14); max-height: 42%;
    overflow-y: auto; padding: 10px 14px; font: 12px "Microsoft YaHei"; }
  #dt::-webkit-scrollbar { width: 6px; }
  #dt::-webkit-scrollbar-thumb { background: rgba(57,208,255,.25); border-radius: 3px; }
  #dt h3 { color: #7fd4ff; font-size: 12px; margin-bottom: 6px; letter-spacing: 1px; }
  #dt .kv { margin: 4px 0; color: rgba(200,230,255,.85); word-break: break-all;
    white-space: pre-wrap; user-select: text; }
  #dt .k { color: rgba(140,190,235,.55); }
  #dt .empty { color: rgba(140,190,235,.4); }

  /* 底部控制条 */
  #bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 30;
    background: var(--bg-menu); border: 1px solid var(--bd-menu); border-radius: 10px;
    display: flex; align-items: center; gap: 10px; padding: 7px 14px;
    font: 12px "Microsoft YaHei"; }
  #bar button { background: rgba(57,208,255,.1); color: #7fd4ff; cursor: pointer;
    border: 1px solid var(--bd-menu); border-radius: 6px; padding: 4px 10px;
    font: 12px "Microsoft YaHei"; }
  #bar button:hover { background: rgba(57,208,255,.22); }
  #bar button.on { background: rgba(57,208,255,.3); color: #fff; }
  #bar label { display: flex; align-items: center; gap: 4px; color: rgba(180,220,250,.85);
    cursor: pointer; }
  #bar select { background: rgba(12,18,30,.9); color: #7fd4ff;
    border: 1px solid var(--bd-menu); border-radius: 5px; padding: 2px 4px; }
  #pos { color: rgba(140,190,235,.6); font: 11px Consolas, monospace; min-width: 70px;
    text-align: center; }

  /* 响应式：中等窗口收窄面板；小窗口面板转底部抽屉 */
  @media (max-width: 980px) {
    #panel { width: 260px; }
    #legend { right: 272px; }
  }
  @media (max-width: 700px) {
    #legend, #hint { display: none; }
    #panel { top: auto; left: 0; width: 100%; height: 44%;
      border-left: none; border-top: 1px solid var(--bd-menu); }
    #dt { max-height: 38%; }
    #bar { max-width: 96vw; flex-wrap: wrap; justify-content: center; gap: 6px;
      bottom: calc(44% + 8px); }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <h1>WASILY · 运行可视化</h1>
  <div id="phase"><span id="phaseDot"></span><span id="phaseText">连接中…</span></div>
</div>

<div id="legend">
  <b>节点图例</b>
  <span><i style="color:#39d0ff;background:#39d0ff"></i>用户消息</span>
  <span><i style="color:#b48cff;background:#b48cff"></i>思考</span>
  <span><i style="color:#ffaa33;background:#ffaa33"></i>工具调用</span>
  <span><i style="color:#4ade80;background:#4ade80"></i>成功</span>
  <span><i style="color:#ff5a6a;background:#ff5a6a"></i>失败</span>
  <span><i style="color:#8ff7ff;background:#8ff7ff"></i>回复</span>
</div>

<div id="panel">
  <h2>事件时间线</h2>
  <div id="tl"></div>
  <div id="dt"><div class="empty">点击节点或时间线事件查看详情</div></div>
</div>

<div id="bar">
  <label><input type="checkbox" id="live" checked> 实时跟随</label>
  <button id="bPrev" title="上一步">⏮</button>
  <button id="bPlay" title="播放/暂停回放">▶</button>
  <button id="bNext" title="下一步">⏭</button>
  <select id="speed" title="回放速度">
    <option value="1600">0.5×</option>
    <option value="900" selected>1×</option>
    <option value="450">2×</option>
    <option value="220">4×</option>
  </select>
  <span id="pos">0 / 0</span>
  <select id="sid" title="按会话筛选"><option value="">全部会话</option></select>
  <button id="bReset" title="视角复位">复位视角</button>
</div>

<div id="hint">拖动旋转 · 滚轮缩放 · 双击复位 · 点击节点查看详情</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d");

/* ============ 数据状态 ============ */
let events = [];            // 已应用的事件（按 id 升序）
let nodes = [];             // 与事件对应的 3D 节点（tool_result 合并进 tool_call 节点）
let lastId = 0;
let agent = { phase: "idle", tool: null, state: "idle" };
let cursor = 0;             // 回放游标：events 前 cursor 条可见
let liveFollow = true;
let playing = false;
let playTimer = null;
let selected = null;        // 选中的 node
let sidFilter = "";
const knownSids = new Set();

/* ============ 类型样式 ============ */
const TYPE_STYLE = {
  user_msg:   { color: "#39d0ff", r: 9,  tag: "tag-user",  name: "用户" },
  think:      { color: "#b48cff", r: 6,  tag: "tag-think", name: "思考" },
  tool_call:  { color: "#ffaa33", r: 8,  tag: "tag-tool",  name: "工具" },
  tool_result:{ color: "#4ade80", r: 8,  tag: "tag-ok",    name: "结果" },
  reply:      { color: "#8ff7ff", r: 7,  tag: "tag-reply", name: "回复" },
};
const PHASE_COLOR = { idle: "#2a6a8a", thinking: "#39d0ff", prefill: "#39d0ff",
  decode: "#39d0ff", tool: "#ff8a3c", memory: "#b48cff", error: "#ff5a6a" };
const PHASE_TEXT = { idle: "待命", thinking: "思考中", prefill: "理解输入",
  decode: "生成中", tool: "工具行动中", memory: "记忆读写", error: "异常" };

/* ============ 3D 场景 ============ */
let yaw = 0.6, pitch = 0.42, dist = 30;
let camTX = 0, camTY = 0, camTZ = 0;     // 相机注视目标（实时跟随最新节点）
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();

/* 螺旋布局：第 i 个节点绕中心下降展开；user_msg 外扩标记新任务 */
function layoutPos(i, type) {
  const a = i * 0.55;
  const rad = type === "user_msg" ? 8.6 : 7.0;
  return { x: Math.cos(a) * rad, y: 3.2 - i * 0.62, z: Math.sin(a) * rad };
}

function project(p) {
  const cy1 = Math.cos(yaw), sy1 = Math.sin(yaw);
  const cp1 = Math.cos(pitch), sp1 = Math.sin(pitch);
  const dx = p.x - camTX, dy = p.y - camTY, dz = p.z - camTZ;
  const x1 = dx * cy1 - dz * sy1;
  const z1 = dx * sy1 + dz * cy1;
  const y2 = dy * cp1 - z1 * sp1;
  const z2 = dy * sp1 + z1 * cp1;
  const f = 26 / (26 + z2 + dist - 26);           // 透视缩放
  const s = 26 / Math.max(4, 26 + z2 + (dist - 26));
  return { x: W / 2 + x1 * s * 22, y: H / 2 + y2 * s * 22, z: z2, s };
}

function addEvent(ev) {
  events.push(ev);
  knownSids.add(ev.sid || "default");
  if (ev.type === "tool_result") {
    // 合并到最近一个同工具、未完成的 tool_call 节点
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      if (n.ev.type === "tool_call" && n.ev.tool === ev.tool && !n.done) {
        n.done = true; n.ok = ev.ok !== false;
        n.result = ev.result; n.dur = ev.dur;
        n.color = n.ok ? "#4ade80" : "#ff5a6a";
        return;
      }
    }
  }
  const st = TYPE_STYLE[ev.type] || TYPE_STYLE.think;
  const p = layoutPos(nodes.length, ev.type);
  nodes.push({ ev, x: p.x, y: p.y, z: p.z, r: st.r, color: st.color, done: false });
  if (liveFollow) cursor = events.length;
}

/* ============ 轮询 ============ */
async function poll() {
  try {
    const r = await fetch("/tool_events?since=" + lastId);
    const d = await r.json();
    agent = d.agent || agent;
    (d.events || []).forEach(e => { addEvent(e); lastId = Math.max(lastId, e.id); });
    renderPhase(); renderTimeline(); renderSidSelect();
  } catch (e) {
    $("#phaseText").textContent = "服务未连接";
    $("#phaseDot").style.background = "#ff5a6a";
  }
}
setInterval(poll, 1000); poll();

function renderPhase() {
  const ph = agent.phase || "idle";
  $("#phaseDot").style.background = PHASE_COLOR[ph] || "#2a6a8a";
  $("#phaseDot").style.color = PHASE_COLOR[ph] || "#2a6a8a";
  $("#phaseText").textContent =
    (PHASE_TEXT[ph] || ph) + (agent.tool ? " · " + agent.tool : "");
}

function renderSidSelect() {
  const sel = $("#sid");
  const cur = sel.value;
  const opts = ['<option value="">全部会话</option>'];
  knownSids.forEach(s => opts.push(
    `<option value="${s}" ${s === cur ? "selected" : ""}>${s}</option>`));
  const html = opts.join("");
  if (sel._last !== html) { sel.innerHTML = html; sel._last = html; }
}

/* ============ 时间线 / 详情 ============ */
function evSummary(ev) {
  if (ev.type === "user_msg") return (ev.text || "").slice(0, 30);
  if (ev.type === "think") return (ev.text || "").slice(0, 30);
  if (ev.type === "tool_call") return ev.tool + "()";
  if (ev.type === "reply") return (ev.text || "").slice(0, 30);
  return "";
}
function evTag(ev, node) {
  if (ev.type === "tool_call" && node && node.done)
    return node.ok ? ["tag-ok", "成功"] : ["tag-err", "失败"];
  const st = TYPE_STYLE[ev.type] || TYPE_STYLE.think;
  return [st.tag, st.name];
}

function renderTimeline() {
  const tl = $("#tl");
  const frag = document.createDocumentFragment();
  const visSet = visibleSet();
  events.forEach((ev, i) => {
    const n = nodesForEvent(ev);
    if (sidFilter && (ev.sid || "default") !== sidFilter) return;
    const div = document.createElement("div");
    div.className = "ev" + (selected && selected.ev === ev ? " sel" : "")
      + (visSet.has(ev.id) ? "" : " dim");
    const [tag, name] = evTag(ev, n);
    const t = new Date(ev.ts * 1000);
    const hh = String(t.getHours()).padStart(2, "0");
    const mm = String(t.getMinutes()).padStart(2, "0");
    const ss = String(t.getSeconds()).padStart(2, "0");
    div.innerHTML = `<span class="t">${hh}:${mm}:${ss}</span>`
      + `<span class="tag ${tag}">${name}</span>`
      + `<span class="s"></span>`;
    div.querySelector(".s").textContent = evSummary(ev);
    div.onclick = () => { const nn = nodesForEvent(ev); if (nn) select(nn); };
    frag.appendChild(div);
  });
  tl.innerHTML = ""; tl.appendChild(frag);
  $("#pos").textContent = Math.min(cursor, events.length) + " / " + events.length;
}

function nodesForEvent(ev) {
  if (ev.type === "tool_result") {
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      if (n.ev.type === "tool_call" && n.ev.tool === ev.tool && n.done) return n;
    }
    return null;
  }
  return nodes.find(n => n.ev === ev) || null;
}

function select(n) {
  selected = n;
  const ev = n.ev;
  const dt = $("#dt");
  const rows = [];
  const t = new Date(ev.ts * 1000).toLocaleTimeString();
  rows.push(`<div class="kv"><span class="k">类型：</span>${(TYPE_STYLE[ev.type] || {}).name || ev.type}</div>`);
  rows.push(`<div class="kv"><span class="k">时间：</span>${t}</div>`);
  rows.push(`<div class="kv"><span class="k">会话：</span>${ev.sid || "default"}</div>`);
  if (ev.round != null) rows.push(`<div class="kv"><span class="k">轮次：</span>第 ${ev.round} 轮</div>`);
  if (ev.tool) rows.push(`<div class="kv"><span class="k">工具：</span>${ev.tool}</div>`);
  if (ev.args) rows.push(`<div class="kv"><span class="k">参数：</span>${escapeHtml(ev.args)}</div>`);
  if (ev.confirm) rows.push(`<div class="kv"><span class="k">敏感操作：</span>需用户确认</div>`);
  if (n.dur != null) rows.push(`<div class="kv"><span class="k">耗时：</span>${n.dur}s</div>`);
  if (n.done) rows.push(`<div class="kv"><span class="k">状态：</span>${n.ok ? "成功" : "失败"}</div>`);
  if (n.result) rows.push(`<div class="kv"><span class="k">结果：</span>${escapeHtml(n.result)}</div>`);
  if (ev.text) rows.push(`<div class="kv"><span class="k">内容：</span>${escapeHtml(ev.text)}</div>`);
  dt.innerHTML = `<h3>事件详情 #${ev.id}</h3>` + rows.join("");
  renderTimeline();
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ============ 回放 ============ */
function visibleSet() {
  const set = new Set();
  const lim = Math.min(cursor, events.length);
  for (let i = 0; i < lim; i++) set.add(events[i].id);
  return set;
}
function setCursor(v) {
  cursor = Math.max(0, Math.min(events.length, v));
  if (cursor < events.length) { liveFollow = false; $("#live").checked = false; }
  renderTimeline();
}
$("#bPrev").onclick = () => { stopPlay(); setCursor(cursor - 1); };
$("#bNext").onclick = () => { stopPlay(); setCursor(cursor + 1); };
$("#bPlay").onclick = () => {
  if (playing) { stopPlay(); return; }
  if (cursor >= events.length) cursor = 0;
  playing = true; $("#bPlay").textContent = "⏸"; $("#bPlay").classList.add("on");
  const step = () => {
    if (!playing) return;
    if (cursor >= events.length) { stopPlay(); liveFollow = true; $("#live").checked = true; renderTimeline(); return; }
    setCursor(cursor + 1);
    playTimer = setTimeout(step, +$("#speed").value);
  };
  step();
};
function stopPlay() {
  playing = false; clearTimeout(playTimer);
  $("#bPlay").textContent = "▶"; $("#bPlay").classList.remove("on");
}
$("#live").onchange = e => {
  liveFollow = e.target.checked;
  if (liveFollow) { cursor = events.length; renderTimeline(); }
};
$("#sid").onchange = e => { sidFilter = e.target.value; renderTimeline(); };
$("#bReset").onclick = () => {
  yaw = 0.6; pitch = 0.42; dist = 30; camTX = camTY = camTZ = 0;
};

/* ============ 交互：拖动旋转 / 滚轮缩放 / 双击复位 / 点击选中 ============ */
let dragging = false, dragMoved = 0, lastX = 0, lastY = 0;
cv.addEventListener("mousedown", e => { dragging = true; dragMoved = 0; lastX = e.clientX; lastY = e.clientY; });
addEventListener("mouseup", e => {
  if (dragging && dragMoved < 5) pickNode(e.clientX, e.clientY);
  dragging = false;
});
addEventListener("mousemove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  dragMoved += Math.abs(dx) + Math.abs(dy);
  yaw += dx * 0.006; pitch = Math.max(-1.4, Math.min(1.4, pitch + dy * 0.006));
  lastX = e.clientX; lastY = e.clientY;
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  dist = Math.max(8, Math.min(90, dist + e.deltaY * 0.03));
}, { passive: false });
cv.addEventListener("dblclick", () => { yaw = 0.6; pitch = 0.42; dist = 30; });

function pickNode(px, py) {
  const vis = visibleNodes();
  let best = null, bestD = 18;
  vis.forEach(n => {
    const p = project(n);
    const d = Math.hypot(p.x - px, p.y - py);
    if (d < bestD) { bestD = d; best = n; }
  });
  if (best) select(best);
}

/* ============ 渲染 ============ */
function visibleNodes() {
  const visSet = visibleSet();
  return nodes.filter(n => visSet.has(n.ev.id)
    && (!sidFilter || (n.ev.sid || "default") === sidFilter));
}

let pulse = 0;
function frame() {
  requestAnimationFrame(frame);
  pulse += 0.05;
  ctx.clearRect(0, 0, W, H);

  // 背景星云
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.6);
  g.addColorStop(0, "rgba(22,75,155,0.14)");
  g.addColorStop(0.5, "rgba(12,48,110,0.06)");
  g.addColorStop(1, "transparent");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const vis = visibleNodes();

  // 实时跟随：相机目标缓动到最新可见节点
  if (liveFollow && vis.length) {
    const last = vis[vis.length - 1];
    camTX += (last.x - camTX) * 0.04;
    camTY += (last.y - camTY) * 0.04;
    camTZ += (last.z - camTZ) * 0.04;
  }

  // 中心核心：颜色 = 当前相位
  const phColor = PHASE_COLOR[agent.phase] || "#2a6a8a";
  const core = project({ x: 0, y: 0, z: 0 });
  const coreR = 14 * core.s * (1 + Math.sin(pulse * 2) * 0.06);
  const cg = ctx.createRadialGradient(core.x, core.y, 0, core.x, core.y, coreR * 3.2);
  cg.addColorStop(0, phColor + "cc"); cg.addColorStop(0.35, phColor + "44");
  cg.addColorStop(1, "transparent");
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(core.x, core.y, coreR * 3.2, 0, 7); ctx.fill();
  ctx.fillStyle = phColor;
  ctx.beginPath(); ctx.arc(core.x, core.y, coreR * 0.55, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(220,245,255,.9)";
  ctx.font = `600 ${Math.max(10, 11 * core.s)}px Consolas`;
  ctx.textAlign = "center";
  ctx.fillText("AI", core.x, core.y + coreR + 14);

  // 连线：时序相邻 + 工具节点到核心的调用辐条
  ctx.lineWidth = 1;
  for (let i = 1; i < vis.length; i++) {
    const a = project(vis[i - 1]), b = project(vis[i]);
    const alpha = Math.max(0.08, Math.min(0.5, 0.55 - (a.z + 20) * 0.006));
    ctx.strokeStyle = `rgba(57,208,255,${alpha})`;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  vis.forEach(n => {
    if (n.ev.type !== "tool_call") return;
    const p = project(n);
    ctx.strokeStyle = n.done
      ? (n.ok ? "rgba(74,222,128,.35)" : "rgba(255,90,106,.4)")
      : "rgba(255,170,51,.35)";
    ctx.beginPath(); ctx.moveTo(core.x, core.y); ctx.lineTo(p.x, p.y); ctx.stroke();
  });

  // 流动粒子：沿最新一条时序边运动
  if (vis.length >= 2) {
    const a = project(vis[vis.length - 2]), b = project(vis[vis.length - 1]);
    for (let k = 0; k < 3; k++) {
      const t = (pulse * 0.6 + k / 3) % 1;
      const x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;
      ctx.fillStyle = `rgba(140,230,255,${0.9 - t * 0.5})`;
      ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 7); ctx.fill();
    }
  }

  // 节点（按深度排序，远的先画）
  const sorted = vis.slice().sort((m, n) => project(n).z - project(m).z);
  const latest = vis[vis.length - 1];
  sorted.forEach(n => {
    const p = project(n);
    const r = Math.max(2.5, n.r * p.s);
    const isSel = selected === n, isLast = n === latest;

    // 光晕
    const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3);
    gg.addColorStop(0, n.color + "88"); gg.addColorStop(1, "transparent");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 3, 0, 7); ctx.fill();

    // 本体
    ctx.fillStyle = n.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.beginPath(); ctx.arc(p.x - r * 0.3, p.y - r * 0.3, r * 0.32, 0, 7); ctx.fill();

    // 最新节点脉冲环
    if (isLast) {
      const pr = r + 4 + (pulse * 8 % 14);
      ctx.strokeStyle = `rgba(57,208,255,${Math.max(0, 0.7 - (pr - r) * 0.05)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, pr, 0, 7); ctx.stroke();
    }
    // 选中环
    if (isSel) {
      ctx.strokeStyle = "#fff";
      ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 6, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
    }

    // 标签：工具名 / 选中 / 用户消息
    if (n.ev.type === "tool_call" || n.ev.type === "user_msg" || isSel) {
      ctx.fillStyle = "rgba(207,233,255,.85)";
      ctx.font = `${Math.max(9, 10 * p.s)}px "Microsoft YaHei"`;
      ctx.textAlign = "center";
      let label = n.ev.type === "tool_call"
        ? n.ev.tool + (n.done ? (n.ok ? " ✓" : " ✗") : " …")
        : (n.ev.text || "").slice(0, 10);
      ctx.fillText(label, p.x, p.y - r - 6);
    }
  });

  // 空状态提示
  if (!vis.length) {
    ctx.fillStyle = "rgba(140,190,235,.4)";
    ctx.font = '13px "Microsoft YaHei"';
    ctx.textAlign = "center";
    ctx.fillText("暂无运行事件 —— 在对话页发送消息或触发工具调用后，这里会实时展开执行链路", W / 2, H / 2 + 60);
  }
}
frame();
</script>
</body>
</html>
