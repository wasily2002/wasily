<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圆桌会议室 · wasily</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b26; --tile: #1a2130; --line: #2a3348;
    --text: #e6ecf5; --sub: #93a0b8; --sub2: #5f6b82;
    --green: #3fb950; --acc: #ff8a3c; --cy: #39d0ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ===== 顶栏 ===== */
  header {
    flex: none; height: 50px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .logo { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg,#3fb950,#0f5c33);
    display: flex; align-items: center; justify-content: center; font-size: 13px; }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: .3px; }
  header .tag { font-size: 11px; color: var(--sub2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
  header .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--line); background: transparent; color: var(--sub);
    border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .btn:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .btn.on { color: var(--cy); border-color: rgba(57,208,255,.5); background: rgba(57,208,255,.08); }
  .status { font-size: 11px; color: var(--sub2); }
  .status.run { color: var(--green); }

  /* ===== 议题设置条 ===== */
  #setup { flex: none; padding: 10px 14px; background: var(--panel);
    border-bottom: 1px solid var(--line); }
  #setup .row1 { display: flex; gap: 8px; max-width: 1100px; margin: 0 auto; }
  #setup input {
    flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line);
    border-radius: 9px; color: var(--text); padding: 8px 11px; font-size: 13px; outline: none;
    font-family: inherit;
  }
  #setup input:focus { border-color: rgba(57,208,255,.5); }
  .personas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; max-width: 1100px; margin-left: auto; margin-right: auto; }
  .pchip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px;
    color: var(--sub); cursor: pointer; user-select: none; background: transparent;
  }
  .pchip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .pchip.on { color: var(--text); border-color: currentColor; background: rgba(255,255,255,.05); }
  #setup.done .row1 input, #setup.done .personas { display: none; }
  #setup .topicline { display: none; font-size: 12px; color: var(--sub); }
  #setup.done .topicline { display: block; max-width: 1100px; margin: 0 auto; }
  #setup.done .topicline b { color: var(--text); }

  /* ===== 会议室主体 ===== */
  #meet { flex: 1; display: flex; min-height: 0; }
  #grid {
    flex: 1; display: flex; flex-wrap: wrap; gap: 10px; padding: 12px;
    align-content: center; justify-content: center;
    max-width: 1240px; margin: 0 auto; width: 100%;
  }

  /* 参会者窗口（视频会议瓷砖） */
  .tile {
    position: relative; flex: 1 1 300px; max-width: 560px;
    border-radius: 14px; background:
      radial-gradient(120% 120% at 50% 0%, #232c42 0%, var(--tile) 55%, #141a27 100%);
    border: 2px solid var(--line); min-height: 190px; aspect-ratio: 16/9.5;
    overflow: hidden; transition: border-color .25s, box-shadow .25s, transform .25s;
  }
  /* 手动拖过尺寸的窗口：脱离弹性自适应 */
  .tile.rs { flex: none; max-width: none; }
  /* 右下角缩放把手 */
  .tile .grip { position: absolute; right: 0; bottom: 0; width: 20px; height: 20px;
    cursor: nwse-resize; z-index: 6; }
  .tile .grip::before { content: ""; position: absolute; right: 4px; bottom: 4px;
    width: 9px; height: 9px; border-right: 2px solid var(--sub2);
    border-bottom: 2px solid var(--sub2); border-radius: 1px; }
  .tile .grip:hover::before { border-color: var(--cy); }
  .tile .ava {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-56%);
    width: 74px; height: 74px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; color: #0d1117;
    animation: breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { transform: translate(-50%,-56%) scale(1); } 50% { transform: translate(-50%,-56%) scale(1.045); } }
  .tile .role-tag {
    position: absolute; top: 8px; left: 10px; font-size: 11px; color: var(--sub2);
    background: rgba(0,0,0,.35); border-radius: 6px; padding: 2px 8px;
  }
  .tile .name {
    position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: #fff;
    background: rgba(0,0,0,.45); border-radius: 7px; padding: 3px 9px;
    display: flex; align-items: center; gap: 6px; z-index: 3;
  }
  .tile .mic {
    position: absolute; right: 10px; bottom: 8px; font-size: 11px; color: var(--sub2);
    background: rgba(0,0,0,.45); border-radius: 7px; padding: 3px 7px; z-index: 3;
  }
  /* 发言中：发光边框 + 声波条 */
  .tile.speaking { border-color: var(--green); box-shadow: 0 0 22px rgba(63,185,80,.4);
    transform: scale(1.012); z-index: 2; }
  .tile .eq { position: absolute; right: 10px; top: 9px; display: none; align-items: flex-end; gap: 3px; height: 14px; z-index: 3; }
  .tile.speaking .eq { display: flex; }
  .tile .eq i { width: 3px; background: var(--green); border-radius: 2px; animation: eq 1s ease-in-out infinite; }
  .tile .eq i:nth-child(2) { animation-delay: .18s; }
  .tile .eq i:nth-child(3) { animation-delay: .36s; }
  .tile .eq i:nth-child(4) { animation-delay: .54s; }
  @keyframes eq { 0%,100% { height: 4px; } 50% { height: 14px; } }
  /* 字幕（该参会者的最新发言） */
  .tile .cap {
    position: absolute; left: 10px; right: 10px; bottom: 40px; z-index: 2;
    font-size: 13px; line-height: 1.6; color: #eaf2ff;
    background: rgba(8,12,20,.72); border-radius: 9px; padding: 8px 11px;
    display: none; max-height: 46%; overflow: hidden;
  }
  .tile .cap.show { display: block; }
  .tile .cap .cursor { display: inline-block; width: 7px; height: 13px; background: var(--cy);
    vertical-align: -2px; animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* 用户窗口 */
  .tile.me { background: radial-gradient(120% 120% at 50% 0%, #1d3a2a 0%, #16241c 60%, #101a14 100%); }
  .tile.me.speaking { border-color: var(--cy); box-shadow: 0 0 22px rgba(57,208,255,.35); }
  .tile .prio { position: absolute; top: 8px; right: 10px; font-size: 10px; color: #0d1117;
    background: var(--acc); border-radius: 999px; padding: 1px 8px; font-weight: 700; z-index: 3; }

  /* ===== 发言记录抽屉 ===== */
  #drawer {
    flex: none; width: 0; overflow: hidden; border-left: 1px solid transparent;
    background: var(--panel); transition: width .25s; display: flex; flex-direction: column;
  }
  #drawer.open { width: 340px; border-left-color: var(--line); }
  #drawer h3 { flex: none; margin: 0; padding: 12px 14px 8px; font-size: 13px; color: var(--sub); }
  #stream { flex: 1; overflow-y: auto; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg .who { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; font-size: 11.5px; color: var(--sub); }
  .msg .who .av { width: 20px; height: 20px; border-radius: 6px; display: flex; align-items: center;
    justify-content: center; font-size: 10px; font-weight: 700; color: #0d1117; }
  .msg .bubble { font-size: 12.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
    background: var(--tile); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; }
  .msg.me .bubble { background: rgba(57,208,255,.1); border-color: rgba(57,208,255,.3); }
  .msg .prio2 { font-size: 10px; color: #0d1117; background: var(--acc); border-radius: 999px; padding: 0 6px; font-weight: 700; }

  /* ===== 底部发言栏（会议控制条风格） ===== */
  #bar { flex: none; padding: 9px 14px 13px; background: linear-gradient(180deg, rgba(13,17,23,0), var(--bg) 40%); }
  #barInner { max-width: 1100px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  #input {
    flex: 1; resize: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; color: var(--text); padding: 10px 13px; font-size: 13.5px;
    font-family: inherit; height: 46px; line-height: 1.5; outline: none;
  }
  #input:focus { border-color: rgba(57,208,255,.5); }
  .send { width: 44px; height: 46px; border: none; border-radius: 12px; background: var(--green);
    color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
  .send:disabled { opacity: .45; cursor: default; }
  .hint { font-size: 11px; color: var(--sub2); padding-bottom: 14px; }

  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: rgba(20,22,28,.96); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 14px; font-size: 12px; display: none; z-index: 40; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--sub2); font-size: 12.5px; text-align: center; line-height: 2; pointer-events: none; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #2f3646; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  @media (max-width: 760px) {
    .tile { flex: 1 1 100% !important; max-width: none !important; min-height: 150px; }
    .tile.rs { flex: none !important; }
    #drawer.open { width: 260px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">🧠</div>
  <h1>圆桌会议室</h1>
  <span class="tag">你的发言 = 最高优先级</span>
  <span class="spacer"></span>
  <span class="status" id="status">未开始</span>
  <button class="btn" id="voiceBtn" title="开启后每位 AI 发言时用不同音色朗读">🔇 语音播报</button>
  <button class="btn" id="drawerBtn" title="查看完整发言记录">💬 记录</button>
  <button class="btn" id="resetBtn">新会议</button>
</header>

<div id="setup">
  <div class="topicline">议题：<b id="topicShow"></b></div>
  <div class="row1">
    <input id="topicInput" placeholder="输入会议议题，例如：本地 7B 模型如何稳定支撑 IDE 的 Agent 编程能力？">
    <button class="btn" id="startBtn" style="color:#3fb950;border-color:rgba(63,185,80,.5)">▶ 开始会议</button>
  </div>
  <div class="personas" id="personas"></div>
</div>

<div id="meet">
  <div id="grid"></div>
  <div id="drawer">
    <h3>完整发言记录</h3>
    <div id="stream"></div>
  </div>
</div>

<div id="bar">
  <div id="barInner">
    <span class="hint">随时插话<br>最高优先</span>
    <textarea id="input" placeholder="发言（Ctrl+Enter 发送）"></textarea>
    <button class="send" id="sendBtn" title="发送 (Ctrl+Enter)">↑</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var PERSONAS = [];
  var selected = {};
  var jobId = null;
  var seen = 0;
  var polling = null;
  var busy = false;
  var voiceOn = false;
  var tiles = {};          // personaId -> tile 元素
  var revealQ = [];        // 待播报消息队列
  var revealing = false;
  var curAudio = null;

  /* 每位 AI 分配不同 edge-tts 音色 */
  var VOICE_POOL = ["zh-CN-YunxiNeural", "zh-CN-XiaoyiNeural", "zh-CN-YunyangNeural", "zh-CN-liaoning-XiaobeiNeural"];

  var gridEl = document.getElementById('grid');
  var statusEl = document.getElementById('status');
  var inputEl = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var topicEl = document.getElementById('topicInput');
  var personaBox = document.getElementById('personas');
  var toastEl = document.getElementById('toast');
  var streamEl = document.getElementById('stream');
  var setupEl = document.getElementById('setup');

  function $(id){ return document.getElementById(id); }
  function toast(t) {
    toastEl.textContent = t; toastEl.style.display = 'block';
    clearTimeout(toast.timer); toast.timer = setTimeout(function(){ toastEl.style.display = 'none'; }, 2400);
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function initials(name) { return String(name).replace(/[·\s]/g,'').slice(0,1); }
  function personaOf(nameOrId) {
    for (var i = 0; i < PERSONAS.length; i++)
      if (PERSONAS[i].id === nameOrId || PERSONAS[i].name === nameOrId) return PERSONAS[i];
    return null;
  }

  /* ================= 参会者窗口 ================= */
  var SIZES_KEY = 'grp_tile_sizes';
  function loadSizes() { try { return JSON.parse(localStorage.getItem(SIZES_KEY) || '{}'); } catch (e) { return {}; } }
  function saveSizes(s) { try { localStorage.setItem(SIZES_KEY, JSON.stringify(s)); } catch (e) {} }

  function attachGrip(t, id) {
    var g = document.createElement('div');
    g.className = 'grip';
    g.title = '拖动调整窗口大小 · 双击恢复自动';
    t.appendChild(g);
    g.addEventListener('mousedown', function (e) {
      e.preventDefault(); e.stopPropagation();
      var r0 = t.getBoundingClientRect(), sx = e.clientX, sy = e.clientY;
      function mv(ev) {
        var w = Math.max(200, Math.min(1100, r0.width + ev.clientX - sx));
        var h = Math.max(140, Math.min(760, r0.height + ev.clientY - sy));
        t.classList.add('rs');
        t.style.width = w + 'px'; t.style.height = h + 'px';
      }
      function up() {
        document.removeEventListener('mousemove', mv);
        document.removeEventListener('mouseup', up);
        var s = loadSizes();
        s[id] = [parseInt(t.style.width, 10) || 0, parseInt(t.style.height, 10) || 0];
        saveSizes(s);
      }
      document.addEventListener('mousemove', mv);
      document.addEventListener('mouseup', up);
    });
    g.addEventListener('dblclick', function (e) {
      e.stopPropagation();
      t.classList.remove('rs');
      t.style.width = ''; t.style.height = '';
      var s = loadSizes(); delete s[id]; saveSizes(s);
    });
  }

  function makeTile(p, isMe) {
    var t = document.createElement('div');
    t.className = 'tile' + (isMe ? ' me' : '');
    t.id = 'tile-' + (isMe ? 'me' : p.id);
    var color = isMe ? '#39d0ff' : (p.color || '#7aa2f7');
    t.innerHTML =
      '<div class="eq"><i></i><i></i><i></i><i></i></div>' +
      (isMe ? '<span class="prio">最高优先级</span>' : '<span class="role-tag">AI 参会者</span>') +
      '<div class="ava" style="background:' + color + '">' + (isMe ? '你' : esc(initials(p.name))) + '</div>' +
      '<div class="cap"></div>' +
      '<span class="name"><span style="width:7px;height:7px;border-radius:50%;background:' + color + ';display:inline-block"></span>' +
        (isMe ? '你（主持人）' : esc(p.name)) + '</span>' +
      '<span class="mic">🎙</span>';
    var tid = isMe ? 'me' : p.id;
    attachGrip(t, tid);
    var sv = loadSizes()[tid];
    if (sv && sv[0] >= 200 && sv[1] >= 140) {
      t.classList.add('rs');
      t.style.width = sv[0] + 'px'; t.style.height = sv[1] + 'px';
    }
    return t;
  }

  function renderGrid() {
    gridEl.innerHTML = '';
    tiles = {};
    var chosen = PERSONAS.filter(function(p){ return selected[p.id]; });
    chosen.forEach(function(p){
      var t = makeTile(p, false);
      gridEl.appendChild(t);
      tiles[p.id] = t;
    });
    var me = makeTile(null, true);
    gridEl.appendChild(me);
    tiles['__me__'] = me;
    var n = chosen.length + 1;
    gridEl.className = '';
    gridEl.id = 'grid';
    gridEl.classList.add('n' + Math.min(6, Math.max(2, n)));
    if (!chosen.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = '选择上方参会的 AI，输入议题后「开始会议」<br>每位 AI 一个窗口，发言时窗口高亮并显示字幕';
      gridEl.appendChild(e);
    }
  }

  /* ================= 发言播报（队列逐个：高亮 + 打字机字幕 + 可选语音） ================= */
  function setCaption(tile, text, done) {
    var cap = tile.querySelector('.cap');
    cap.classList.add('show');
    cap.innerHTML = '<span class="t"></span><span class="cursor"></span>';
    var tEl = cap.querySelector('.t');
    var i = 0, step = Math.max(1, Math.round(text.length / 90));
    var timer = setInterval(function(){
      i = Math.min(text.length, i + step);
      tEl.textContent = text.slice(0, i);
      if (i >= text.length) {
        clearInterval(timer);
        cap.querySelector('.cursor').remove();
        if (done) done();
      }
    }, 50);
    return timer;
  }

  function speakText(text, voice, onend) {
    if (!voiceOn) { onend && onend(); return; }
    try {
      if (curAudio) { curAudio.pause(); curAudio = null; }
      var a = new Audio('/tts?text=' + encodeURIComponent(text.substring(0, 200)) +
                        '&voice=' + encodeURIComponent(voice));
      curAudio = a;
      a.onended = function(){ curAudio = null; onend && onend(); };
      a.onerror = function(){ curAudio = null; onend && onend(); };
      a.play().catch(function(){ curAudio = null; onend && onend(); });
      // 兜底：音频长时间未出声也不卡队列
      setTimeout(function(){ if (curAudio === a && a.readyState < 2) { a.pause(); curAudio = null; onend && onend(); } }, 12000);
    } catch (e) { onend && onend(); }
  }

  function processQueue() {
    if (revealing) return;
    var m = revealQ.shift();
    if (!m) { revealing = false; return; }
    revealing = true;

    if (m.role === 'user') {
      addStreamMsg(m);
      var meTile = tiles['__me__'];
      if (meTile) {
        meTile.classList.add('speaking');
        setTimeout(function(){ meTile.classList.remove('speaking'); revealing = false; processQueue(); }, 900);
      } else { revealing = false; processQueue(); }
      return;
    }
    var p = personaOf(m.name);
    var tile = p && tiles[p.id];
    addStreamMsg(m);
    if (!tile) { revealing = false; processQueue(); return; }
    // 其他窗口静音，本窗口发言
    Object.keys(tiles).forEach(function(k){ tiles[k].classList.remove('speaking'); });
    tile.classList.add('speaking');
    var voice = VOICE_POOL[p ? PERSONAS.indexOf(p) % VOICE_POOL.length : 0];
    setCaption(tile, m.content, function(){
      speakText(m.content, voice, function(){
        tile.classList.remove('speaking');
        revealing = false;
        processQueue();
      });
    });
  }

  /* ================= 发言记录抽屉 ================= */
  function addStreamMsg(m) {
    var d = document.createElement('div');
    d.className = 'msg' + (m.role === 'user' ? ' me' : '');
    var color = m.role === 'user' ? '#39d0ff' : (m.color || '#7aa2f7');
    var who = document.createElement('div');
    who.className = 'who';
    who.innerHTML = m.role === 'user'
      ? '<span class="prio2">最高优先级</span><span>你</span>'
      : '<span class="av" style="background:' + color + '">' + esc(initials(m.name)) + '</span>' +
        '<span style="color:' + color + '">' + esc(m.name) + '</span>' +
        (m.round ? '<span style="color:var(--sub2)">R' + m.round + '</span>' : '');
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = m.content;
    d.appendChild(who); d.appendChild(bubble);
    streamEl.appendChild(d);
    streamEl.scrollTop = streamEl.scrollHeight;
  }

  /* ================= 状态与轮询 ================= */
  function setStatus(running) {
    statusEl.className = 'status' + (running ? ' run' : '');
    statusEl.textContent = running ? '会议进行中…' : (jobId ? '休会中' : '未开始');
  }

  function poll() {
    if (!jobId) return;
    fetch('/group/state?job=' + encodeURIComponent(jobId) + '&since=' + seen)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.error) { toast(d.error); stopPolling(); return; }
        (d.messages || []).forEach(function(m){ revealQ.push(m); });
        seen = d.total;
        processQueue();
        setStatus(d.status === 'running');
      })
      .catch(function(){ /* 下一次重试 */ });
  }

  function startPolling() {
    stopPolling();
    polling = setInterval(poll, 2000);
  }
  function stopPolling() {
    if (polling) { clearInterval(polling); polling = null; }
  }

  /* ================= 会议控制 ================= */
  function start() {
    var topic = topicEl.value.trim();
    var first = inputEl.value.trim();
    if (!topic && !first) { toast('先输入会议议题'); topicEl.focus(); return; }
    var ids = PERSONAS.filter(function(p){ return selected[p.id]; }).map(function(p){ return p.id; });
    if (!ids.length) { toast('至少选择一位参会 AI'); return; }
    busy = true; sendBtn.disabled = true;
    fetch('/group/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic: topic || first, message: first, personas: ids })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!d.id) { toast(d.error || '启动失败'); busy = false; sendBtn.disabled = false; return; }
      jobId = d.id; seen = 0;
      streamEl.innerHTML = '';
      revealQ = []; revealing = false;
      setupEl.classList.add('done');
      $('topicShow').textContent = topic || first;
      if (first) { revealQ.push({ role:'user', name:'你', content: first }); seen = 1; processQueue(); }
      setStatus(true);
      startPolling(); poll();
      busy = false; sendBtn.disabled = false;
      inputEl.value = '';
      toast('会议开始，' + ids.length + ' 位 AI 已入会');
    }).catch(function(e){ toast('启动失败：' + e.message); busy = false; sendBtn.disabled = false; });
  }

  function send() {
    var text = inputEl.value.trim();
    if (!text) return;
    if (!jobId) { start(); return; }
    inputEl.value = '';
    revealQ.push({ role:'user', name:'你', content: text });
    seen++;
    processQueue();
    fetch('/group/message', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ job: jobId, text: text })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (d.error) { toast(d.error); return; }
      setStatus(true);
      if (!polling) startPolling();
    }).catch(function(e){ toast('发送失败：' + e.message); });
  }

  function resetAll() {
    stopPolling();
    jobId = null; seen = 0; revealQ = []; revealing = false;
    if (curAudio) { curAudio.pause(); curAudio = null; }
    streamEl.innerHTML = '';
    setupEl.classList.remove('done');
    topicEl.value = '';
    setStatus(false);
    renderGrid();
  }

  /* ================= 初始化 ================= */
  fetch('/group/personas').then(function(r){ return r.json(); }).then(function(d){
    PERSONAS = d.personas || [];
    PERSONAS.forEach(function(p, i){
      selected[p.id] = i < 3;
      var chip = document.createElement('span');
      chip.className = 'pchip' + (selected[p.id] ? ' on' : '');
      chip.style.color = p.color;
      chip.innerHTML = '<span class="dot" style="background:' + p.color + '"></span>' + esc(p.name);
      chip.addEventListener('click', function(){
        selected[p.id] = !selected[p.id];
        chip.classList.toggle('on', selected[p.id]);
        renderGrid();
      });
      personaBox.appendChild(chip);
    });
    renderGrid();
  }).catch(function(){ toast('无法读取 AI 列表'); });

  $('startBtn').addEventListener('click', start);
  sendBtn.addEventListener('click', send);
  $('resetBtn').addEventListener('click', resetAll);
  $('drawerBtn').addEventListener('click', function(){
    var dr = $('drawer');
    dr.classList.toggle('open');
    this.classList.toggle('on', dr.classList.contains('open'));
  });
  $('voiceBtn').addEventListener('click', function(){
    voiceOn = !voiceOn;
    this.classList.toggle('on', voiceOn);
    this.textContent = voiceOn ? '🔊 语音播报' : '🔇 语音播报';
    if (!voiceOn && curAudio) { curAudio.pause(); curAudio = null; }
    toast(voiceOn ? '语音播报已开启（每位 AI 不同音色）' : '语音播报已关闭');
  });
  inputEl.addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); send(); }
  });
  setStatus(false);
})();
</script>
</body>
</html>
