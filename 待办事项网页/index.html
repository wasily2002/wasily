<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To Do List</title>
    <style>
        body { font-family: Arial, sans-serif; }
        ul { list-style-type: none; padding-left: 0; margin-top: 15px; }
        li { display: flex; align-items: center; justify-content: space-between; background-color: #f2f2f2; padding: 8px; margin-bottom: 4px; border-radius: 6px; }
        input[type="checkbox"] { width: auto; height: auto; cursor: pointer; }
    </style>
</head>
<body>

<h1>To Do List</h1>
<button onclick="addTask()">Add Task</button>
<ul id="taskList"></ul>

<script>
function addTask() {
    const taskInput = document.getElementById('newTask');
    if (taskInput.value) {
        let li = `<li><input type="checkbox" onchange="toggleComplete(this)"> ${taskInput.value} <span onclick="deleteTask(event)" style="cursor: pointer; margin-left: 10px;">X</span></li>`;
        document.getElementById('taskList').innerHTML += li;
        taskInput.value = "";
    }
}

function toggleComplete(checkbox) {
    if (checkbox.checked) {
        checkbox.parentNode.style.textDecoration = "line-through";
    } else {
        checkbox.parentNode.style.textDecoration = "none";
    }
}

function deleteTask(event) {
    const li = event.target.parentElement;
    document.getElementById('taskList').removeChild(li);
}
</script>

<input type="text" id="newTask" placeholder="Enter new task">

</body>
</html>
